<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eggselent">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Eggselent</title>
<style>
/* iOS-ontwerpsysteem: systeemkleuren (toegankelijke varianten), SF-typografie, inset-grouped lijsten */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --cell2:#F2F2F7; --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.16); --fill2:rgba(120,120,128,.24); --press:rgba(0,0,0,.06);
  --tint:#C93400; --on-tint:#FFFFFF; --red:#D70015; --green:#248A3D; --blue:#0040DD; --orange:#C93400; --gray:#8E8E93; --yellow:#B25000;
  --red-s:rgba(215,0,21,.10); --green-s:rgba(36,138,61,.12); --blue-s:rgba(0,64,221,.10); --orange-s:rgba(201,52,0,.10); --note-s:#FFF6D5;
  --bar:rgba(249,249,249,.82); --shadow:0 1px 3px rgba(0,0,0,.08);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --cell:#1C1C1E; --cell2:#2C2C2E; --label:#FFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.65); --fill:rgba(120,120,128,.32); --fill2:rgba(120,120,128,.44); --press:rgba(255,255,255,.08);
    --tint:#FF9F0A; --on-tint:#1C1C1E; --red:#FF453A; --green:#30D158; --blue:#0A84FF; --orange:#FF9F0A; --yellow:#FFD60A;
    --red-s:rgba(255,69,58,.18); --green-s:rgba(48,209,88,.18); --blue-s:rgba(10,132,255,.2); --orange-s:rgba(255,159,10,.18); --note-s:rgba(255,214,10,.14);
    --bar:rgba(22,22,24,.8); --shadow:none;
  }
}
@media (prefers-contrast: more){ :root{ --sep:rgba(60,60,67,.6); --label2:rgba(60,60,67,.85) } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px;font:-apple-system-body;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;line-height:1.3;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;margin:0}
h1,h2,h3,p{margin:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.i{width:1.4rem;height:1.4rem;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:1.05rem;height:1.05rem}
.i.lg{width:1.75rem;height:1.75rem}
.i.fill{fill:currentColor;stroke:none}

/* navigatiebalk */
.nav{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--sep)}
.nav-t{font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.nav-l,.nav-r{display:flex;align-items:center;gap:4px}
.nav-r{justify-content:flex-end}
.nb{display:inline-flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 8px;color:var(--tint);font-size:1rem;justify-content:center}
.nb.back{padding-left:0}
.nb.back .i{width:1.6rem;height:1.6rem;stroke-width:2.3}
.nb:active{opacity:.35}
.nb.bold{font-weight:600}
.lt{padding:4px 20px 8px}
.lt h1{font-size:2rem;font-weight:700;letter-spacing:.01em;line-height:1.2}
.lt .sub{color:var(--label2);font-size:.882rem;margin-top:2px}
main{padding:0 16px calc(env(safe-area-inset-bottom) + 110px);max-width:680px;margin:0 auto}

/* secties en lijsten (zoals Instellingen) */
.sec{margin-top:24px}
.sec:first-child{margin-top:8px}
.sec-h{font-size:.765rem;text-transform:uppercase;color:var(--label2);padding:0 16px 7px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:flex-end}
.sec-h.tog{text-transform:none;font-size:1.176rem;font-weight:700;color:var(--label);padding:0 4px 8px;width:100%;text-align:left;letter-spacing:0;align-items:center;justify-content:flex-start;gap:6px}
.sec-h.tog .i{color:var(--tint);transition:transform .2s}
.sec-h.tog.open .i{transform:rotate(90deg)}
.sec-f{font-size:.765rem;color:var(--label2);padding:7px 16px 0;line-height:1.38}
.grp{background:var(--cell);border-radius:12px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:11px 16px;text-align:left;background:var(--cell);color:var(--label)}
.cell:not(:last-child)::after{content:"";position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep)}
.cell.ind:not(:last-child)::after{left:52px}
button.cell:active,a.cell:active{background:var(--press)}
.cell .tx{flex:1;min-width:0}
.cell .tt{display:block;font-size:1rem}
.cell .st{display:block;font-size:.882rem;color:var(--label2);margin-top:2px}
.cell .st.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .tr{color:var(--label2);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.cell .chev{color:var(--label3);width:.9rem;height:.9rem;stroke-width:2.4}
.cell.red{color:var(--red)} .cell.tint{color:var(--tint)} .cell.center{justify-content:center}
.cell.dim{opacity:.5}
.cell.cur{background:var(--orange-s)}
.house-main{touch-action:pan-y;transition:transform .2s,opacity .2s}
.cell .no{width:1.6rem;color:var(--label2);font-size:.882rem;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.cell.field{padding-top:6px;padding-bottom:6px}
.cell.field .fl{width:7.2rem;flex:none}
.cell.field input,.cell.field select{flex:1;min-width:0;border:0;background:none;padding:8px 0;font-size:1rem;text-align:right;-webkit-appearance:none;appearance:none}
.cell.field input:focus{outline:none}
.cell textarea,.ta{width:100%;border:0;background:none;resize:vertical;min-height:4.5rem;font-size:1rem;padding:0;line-height:1.35}
.cell.stack{flex-direction:column;align-items:stretch;gap:10px}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--red);flex:none}
.dot.none{background:transparent}
.ico{width:1.75rem;height:1.75rem;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ico .i{width:1.1rem;height:1.1rem;stroke-width:2.1}

/* knoppen */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;padding:0 16px;font-weight:600;font-size:1rem;background:var(--tint);color:var(--on-tint);transition:transform .08s,opacity .1s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.gray{background:var(--fill);color:var(--tint)}
.btn.gray.red{color:var(--red)}
.btn.big{min-height:56px;font-size:1.06rem;border-radius:14px}
.btn:disabled{opacity:.4}
.btn .i{width:1.25rem;height:1.25rem;stroke-width:2.2}
.link{color:var(--tint);font-weight:500;min-height:44px;display:inline-flex;align-items:center}
.link:active{opacity:.4}

/* chips en segmentknop */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;min-width:48px;padding:0 14px;border-radius:22px;background:var(--fill);font-weight:600;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--tint);color:var(--on-tint)}
.chip:active{opacity:.6}
.chip.abs{background:var(--red-s);color:var(--red);text-decoration:line-through;opacity:.9}
.chips.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.chips.grid7 .chip{min-width:0;padding:0}
.segc{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.segc button{flex:1;min-height:36px;border-radius:7px;font-size:.882rem;font-weight:500;white-space:nowrap;padding:0 4px}
.segc button[aria-pressed=true]{background:var(--cell);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
@media (prefers-color-scheme: dark){ .segc button[aria-pressed=true]{background:#636366} }
.toggle{position:relative;width:51px;height:31px;border-radius:16px;background:var(--fill2);flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.toggle[aria-checked=true]{background:#34C759}
.toggle[aria-checked=true]::after{transform:translateX(20px)}
.toggle:disabled{opacity:.5}

/* stepper */
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper button{width:56px;height:56px;border-radius:50%;background:var(--fill);color:var(--tint);display:flex;align-items:center;justify-content:center}
.stepper button:active{opacity:.5}
.stepper button .i{width:1.5rem;height:1.5rem;stroke-width:2.4}
.stepper .val{flex:1;text-align:center}
.stepper .val b{display:block;font:700 2.4rem/1 ui-rounded,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.stepper .val span{font-size:.765rem;color:var(--label2)}

/* datum/weekbalk */
.pager{display:flex;align-items:center;gap:4px;padding:0 4px 12px}
.pager .mid{flex:1;text-align:center}
.pager .mid b{display:block;font-size:1rem;font-weight:600}
.pager .mid b::first-letter{text-transform:uppercase}
.pager .mid span{font-size:.765rem;color:var(--label2)}
.pager .nb{color:var(--tint)}

/* meldingen en badges */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;background:var(--cell);font-size:.882rem;line-height:1.38}
.banner .i{margin-top:1px}
.banner.red{background:var(--red-s)} .banner.red .i,.banner.red b{color:var(--red)}
.banner.blue{background:var(--blue-s)} .banner.blue .i{color:var(--blue)}
.badge{display:inline-block;font-size:.706rem;font-weight:600;border-radius:6px;padding:2px 7px;margin:3px 4px 0 0;vertical-align:middle}
.badge.red{background:var(--red-s);color:var(--red)} .badge.blue{background:var(--blue-s);color:var(--blue)} .badge.gray{background:var(--fill);color:var(--label2)} .badge.green{background:var(--green-s);color:var(--green)}
.progress{padding:4px 4px 14px}
.progress .t{font-size:.882rem;color:var(--label2);margin-bottom:8px}
.progress .t b{color:var(--label);font-weight:600}
.bar-bg{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar-fg{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.stat{color:var(--label2);font-variant-numeric:tabular-nums}
.stat.done{color:var(--green);font-weight:600}
.stat.nh{color:var(--red);font-weight:600}
.stat.zero{color:var(--label2);font-weight:600}

/* swipe-rijen (zoals Mail) */
.sw{position:relative;overflow:hidden}
.sw:not(:last-child)::after{content:"";position:absolute;left:52px;right:0;bottom:0;height:.5px;background:var(--sep);z-index:2}
.sw .cell::after{display:none}
.sw-fg{position:relative;z-index:1;touch-action:pan-y;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sw-fg.drag{transition:none}
.sw-a{position:absolute;top:0;bottom:0;display:flex}
.sw-a.l{left:0} .sw-a.r{right:0}
.sw-a button{width:88px;color:#fff;font-weight:600;font-size:.882rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.sw-a .ok{background:#34C759} .sw-a .nh{background:#FF3B30} .sw-a .no{background:#8E8E93}

/* huis */
.addr{padding:6px 4px 12px}
.addr h1{font-size:1.647rem;font-weight:700;line-height:1.15}
.addr .sub{color:var(--label2);font-size:.882rem;margin-top:3px}
.callout{display:flex;gap:10px;background:var(--note-s);border-radius:12px;padding:10px 14px;font-size:.941rem;margin-bottom:12px}
.callout .i{color:var(--yellow)}
.hero{padding:16px}
.hero .lbl{font-size:.765rem;font-weight:600;text-transform:uppercase;color:var(--label2);letter-spacing:.02em}
.hero .big{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.hero .big b{font:700 3.3rem/1 ui-rounded,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.hero .big span{font-size:1.176rem;font-weight:600;color:var(--label2)}
.hero .big.green b{color:var(--green)} .hero .big.red b{color:var(--red);font-size:2.2rem}
.hero .meta{font-size:.882rem;color:var(--label2);margin-top:6px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px 16px}
.mt{border-radius:10px;background:var(--cell2);padding:6px 2px;text-align:center;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.mt .d{font-size:.647rem;color:var(--label2)}
.mt .v{font:700 1.176rem/1.15 ui-rounded,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.mt.sold .v{color:var(--green)} .mt.nh .v{color:var(--red)} .mt.empty{opacity:.45}
.absc{border-radius:12px;background:var(--cell);padding:14px;border:1.5px solid var(--red)}
.absc .h{display:flex;gap:8px;align-items:flex-start;color:var(--red);font-weight:600;margin-bottom:10px}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-bottom:10px}
.wk div{border-radius:10px;padding:7px 4px;text-align:center;border:1.5px solid var(--green);color:var(--green)}
.wk div b{display:block;font-size:1.06rem}
.wk div span{font-size:.706rem;font-weight:600}
.wk div em{display:block;font-size:.588rem;font-style:normal;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
.wk div.x{background:var(--red);border-color:var(--red);color:#fff}
.wk div.x b{text-decoration:line-through}
.script{font-size:.941rem;font-style:italic;color:var(--label);background:var(--cell2);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:52px 1fr 1.5fr;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);view-transition-name:dock}
.dock.two{grid-template-columns:52px 1fr}
.dock .iconbtn{min-height:56px;border-radius:14px;background:var(--fill);color:var(--tint);display:flex;align-items:center;justify-content:center}
.dock .iconbtn:active{opacity:.5}
.dock .btn{min-height:56px}
.dock .btn small{display:block;font-size:.706rem;font-weight:500;opacity:.85}
.dock .btn.stack{flex-direction:column;gap:0;line-height:1.15}

/* planning */
.hero.order .big b{color:var(--tint)}

/* tabbalk */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;padding:6px 4px calc(env(safe-area-inset-bottom) + 2px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);view-transition-name:tabbar}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:49px;font-size:.588rem;font-weight:500;color:var(--gray);position:relative}
.tabbar button .i{width:1.6rem;height:1.6rem}
.tabbar button[aria-current=page]{color:var(--tint)}
.tabbar button[aria-current=page] .i{stroke-width:2.3}
.tabbar .tb{position:absolute;top:2px;left:calc(50% + 6px);min-width:10px;height:10px;border-radius:5px;background:var(--red)}

/* paneel van onderen (sheet) + actieblad */
#sheet,#acts{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet.open,#acts.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .3s}
.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom);max-width:680px;margin:0 auto}
.open .sheet{transform:none}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;min-height:48px}
.sheet-h .nav-t{font-weight:600}
.sheet-c{overflow:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.acts{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);transform:translateY(120%);transition:transform .3s cubic-bezier(.2,.9,.25,1);max-width:560px;margin:0 auto}
.open .acts{transform:none}
.acts .g{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px}
.acts .msg{padding:14px 16px;text-align:center;font-size:.765rem;color:var(--label2);border-bottom:.5px solid var(--sep)}
.acts .msg b{display:block;font-size:.765rem;font-weight:600;margin-bottom:2px}
.acts button{display:block;width:100%;min-height:57px;font-size:1.176rem;color:var(--blue);border-bottom:.5px solid var(--sep)}
.acts button:last-child{border-bottom:0}
.acts button.red{color:var(--red)}
.acts button.bold{font-weight:600}
.acts button:active{background:var(--press)}

/* HUD-melding */
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:60;display:flex;justify-content:center;pointer-events:none}
#toast .t{display:flex;align-items:center;gap:14px;max-width:520px;padding:12px 16px;border-radius:14px;background:rgba(30,30,30,.92);color:#fff;font-size:.882rem;pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);animation:hud .25s ease-out}
#toast .t.err{background:rgba(215,0,21,.95)}
#toast .t button{color:#FF9F0A;font-weight:600;min-height:32px;white-space:nowrap}
@keyframes hud{from{opacity:0;transform:translateY(10px)}}

/* overig */
.brand{text-align:center;padding:calc(env(safe-area-inset-top) + 40px) 0 24px}
.brand img{width:88px;height:88px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.brand h1{font-size:1.647rem;font-weight:700;margin-top:14px}
.brand p{color:var(--label2);margin-top:4px}
.codebox{font:800 2.2rem/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;text-align:center;padding:18px 0 14px}
.daytog{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%}
.daytog .chip{padding:0;min-width:0}
table.h{width:100%;border-collapse:collapse;font-size:.882rem;font-variant-numeric:tabular-nums}
table.h th{text-align:right;color:var(--label2);font-weight:500;font-size:.765rem;padding:10px 16px 6px}
table.h td{text-align:right;padding:10px 16px;border-top:.5px solid var(--sep)}
table.h th:first-child,table.h td:first-child{text-align:left}
.empty{text-align:center;padding:40px 20px;color:var(--label2)}
.empty .i{width:3rem;height:3rem;color:var(--label3);stroke-width:1.5;margin-bottom:10px}
.empty h2{color:var(--label);font-size:1.294rem;font-weight:700;margin-bottom:6px}
.mb{margin-bottom:12px}
.mt12{margin-top:12px}

/* overgangen tussen schermen (zoals een navigatie-stack) */
::view-transition-old(root),::view-transition-new(root){animation-duration:.34s;animation-timing-function:cubic-bezier(.2,.85,.25,1)}
html.push::view-transition-old(root){animation-name:vt-out-l} html.push::view-transition-new(root){animation-name:vt-in-r}
html.pop::view-transition-old(root){animation-name:vt-out-r;z-index:2} html.pop::view-transition-new(root){animation-name:vt-in-l}

<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="acts"></div>
<div id="toast" aria-live="polite"></div>
<script src="config.js"></script>
<input type="file" id="importfile" accept=".json,application/json" hidden>

<script>
'use strict';
const APP_VERSION = '2.1.1';
const KEY = 'eggselent-data-v1';
const UIKEY = 'eggselent-ui-v1';

/* ---------- datums (altijd lokale tijd, nooit toISOString) ---------- */
const DAYS = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const DSH  = ['zo','ma','di','wo','do','vr','za'];
const MON  = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MONL = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const WEEK = [1,2,3,4,5,6,0]; // maandag eerst
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const dow = s => pd(s).getDay();
const monIdx = day => (day + 6) % 7;
const byMon = (x, y) => monIdx(x) - monIdx(y);
const weekStart = s => addDays(s, -monIdx(dow(s)));
const todayStr = () => ymd(new Date());
const fmtShort = s => { const d = pd(s); return `${DSH[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtLong = s => { const d = pd(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONL[d.getMonth()]}`; };
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const weeksBetween = (a, b) => Math.round(daysBetween(weekStart(a), weekStart(b)) / 7);
function isoWeek(s){
  const d = pd(s); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
const weekLabel = T => { const E = addDays(T, 6), a = pd(T), b = pd(E); return `${a.getDate()}${a.getMonth() !== b.getMonth() ? ' ' + MON[a.getMonth()] : ''}–${b.getDate()} ${MON[b.getMonth()]}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);

/* ---------- opslag ---------- */
function emptyDb(){ return migrate({}); }
function migrate(d){
  d.version = 2;
  d.settings = Object.assign({ walkDays: [], lastBackup: null, orderRound: 1, absenceScript: '' }, d.settings || {});
  d.addresses = Array.isArray(d.addresses) ? d.addresses : [];
  d.visits = Array.isArray(d.visits) ? d.visits : [];
  d.absences = Array.isArray(d.absences) ? d.absences : [];
  d.orders = (d.orders && typeof d.orders === 'object') ? d.orders : {};
  for (const a of d.addresses) {
    if (!Array.isArray(a.prefDays)) a.prefDays = (a.prefDay != null && a.prefDay !== '') ? [+a.prefDay] : [];
    delete a.prefDay;
  }
  for (const v of d.visits) if (v.status !== 'nothome' && v.nextEggs == null) v.nextEggs = v.eggs || 0;
  return d;
}
function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.addresses) return migrate(d); } catch (e) {}
  return emptyDb();
}
let db = load();
let _idx = null;
// fromServer = wijziging komt uit de synchronisatie: niet opnieuw naar de server sturen
function save(quiet, fromServer){
  _idx = null;
  try { localStorage.setItem(KEY, JSON.stringify(db)); if (!quiet) flashSaved(); }
  catch (e) { toast('Opslaan is mislukt: ' + e.message + '. Maak zo snel mogelijk een backup via Instellingen.', null, null, 'err'); }
  syncDiff(!fromServer);
}
function vIdx(){
  if (!_idx) {
    _idx = new Map();
    for (const v of db.visits) { if (!_idx.has(v.addressId)) _idx.set(v.addressId, []); _idx.get(v.addressId).push(v); }
    for (const arr of _idx.values()) arr.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  }
  return _idx;
}
const visitsOf = id => vIdx().get(id) || [];
const byId = id => db.addresses.find(a => a.id === id);
const label = a => `${a.street} ${a.number}`.trim();

let persisted = null;
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then(p => p ? true : navigator.storage.persist()).then(p => { persisted = p; }).catch(() => {});
}

/* ---------- account + synchronisatie (Supabase) ----------
   Werkwijze: alles blijft eerst lokaal opgeslagen (werkt zonder bereik). Bij elke save() vergelijken we
   elk record met een hash van de vorige keer; wat anders is gaat in de wachtrij (outbox). Die wordt
   verstuurd zodra er internet is. Daarna halen we op wat teamgenoten hebben gewijzigd (server_ts).
   Conflict: laatste wijziging wint (updated_at), ook op de server afgedwongen. */
// Op localhost gebruikt de app de lokale Supabase (config.js → local): er gaat geen mail de deur uit en de code is vast.
const IS_LOCAL_HOST = /^(localhost|127\.0\.0\.1|\[::1\])$|\.localhost$/.test(location.hostname);
const BASE_CFG = window.EGGSELENT_CONFIG || {};
const CFG = Object.assign({ supabaseUrl: '', supabaseKey: '' }, IS_LOCAL_HOST && BASE_CFG.local ? BASE_CFG.local : BASE_CFG,
  (() => { try { return JSON.parse(localStorage.getItem('eggselent-config')) || {}; } catch (e) { return {}; } })()); // laatste: alleen voor testen
CFG.supabaseUrl = (CFG.supabaseUrl || '').replace(/\/+$/, '');
const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseKey);
// Vaste code alleen als de app echt met een lokale Supabase praat; nooit tegen de online database.
const DEV_CODE = CFG.devCode && /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(CFG.supabaseUrl) ? String(CFG.devCode) : null;
const SKEY = 'eggselent-sync-v1', HKEY = 'eggselent-hash-v1';
const TABLES = ['addresses', 'visits', 'absences', 'orders'];
const CONFLICT = { addresses: 'team_id,id', visits: 'team_id,id', absences: 'team_id,date', orders: 'team_id,week_start' };
const readJson = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
let S = Object.assign({ session: null, userId: null, team: null, teams: [], lastPull: null, settingsU: null, outbox: {}, lastSync: null }, readJson(SKEY, {}));
let H = readJson(HKEY, {});
const saveS = () => { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} };
const saveH = () => { try { localStorage.setItem(HKEY, JSON.stringify(H)); } catch (e) {} };
const syncOn = () => CLOUD && S.session && !S.session.expired && S.team;
const pendingCount = () => Object.keys(S.outbox).length;
const isAdmin = () => !CLOUD || !S.team || S.team.role === 'admin';
let syncing = false, syncErr = null, syncTimer = null, renderDeferred = false;

function hash(s){ let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36) + s.length.toString(36); }
// ISO-tijden van telefoon en server (microseconden) vergelijkbaar maken
const tsMs = s => s ? Date.parse(String(s).replace(/(\.\d{3})\d+/, '$1').replace(' ', 'T')) : 0;

function syncRecords(){
  const out = [];
  db.addresses.forEach((a, i) => out.push(['addresses', a.id, { id: a.id, street: a.street || '', number: a.number || '', name: a.name || '', note: a.note || '', pref_days: a.prefDays || [], sort: i, excluded: !!a.excluded }]));
  for (const v of db.visits) out.push(['visits', v.id, { id: v.id, address_id: v.addressId, date: v.date, status: v.status, eggs: v.eggs || 0, next_date: v.nextDate || null, next_eggs: v.nextEggs ?? null, next_manual: !!v.nextManual, note: v.note || '', double: !!v.double, offered: !!v.offered }]);
  for (const d of db.absences) out.push(['absences', d, { date: d }]);
  for (const [w, n] of Object.entries(db.orders)) out.push(['orders', w, { week_start: w, amount: n }]);
  out.push(['settings', 'team', { walk_days: db.settings.walkDays, order_round: db.settings.orderRound || 1, absence_script: db.settings.absenceScript || '' }]);
  return out;
}
function tombstone(t, k){
  if (t === 'visits') return { id: k, address_id: k.slice(0, -11), date: k.slice(-10), status: 'none' };
  if (t === 'absences') return { date: k };
  if (t === 'orders') return { week_start: k };
  return { id: k };
}
// queue=false: alleen de hashes bijwerken (na ophalen van de server)
function syncDiff(queue){
  if (!CLOUD || !S.team) return;
  const now = new Date().toISOString(), seen = new Set();
  let n = 0;
  for (const [t, k, row] of syncRecords()) {
    const key = t + ':' + k, h = hash(JSON.stringify(row));
    seen.add(key);
    if (H[key] !== h) { H[key] = h; if (queue) { S.outbox[key] = { t, k, row, u: now }; n++; } }
  }
  for (const key of Object.keys(H)) if (!seen.has(key)) {
    const i = key.indexOf(':'), t = key.slice(0, i), k = key.slice(i + 1);
    delete H[key];
    if (queue && t !== 'settings') { S.outbox[key] = { t, k, row: tombstone(t, k), u: now, del: true }; n++; }
  }
  saveH();
  if (n) { saveS(); syncBadge(); scheduleSync(1500); }
}

async function api(path, opts){
  const { method = 'GET', body, headers = {}, auth = true } = opts || {};
  if (auth) await ensureToken();
  const go = () => fetch(CFG.supabaseUrl + path, {
    method,
    headers: Object.assign({ apikey: CFG.supabaseKey, 'Content-Type': 'application/json' }, auth && S.session ? { Authorization: 'Bearer ' + S.session.access_token } : {}, headers),
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let res = await go();
  if (res.status === 401 && auth && S.session) { await refreshToken(); res = await go(); }
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!res.ok) {
    const m = data && (data.msg || data.error_description || data.message || data.error);
    const err = new Error(m || 'Serverfout ' + res.status); err.status = res.status; throw err;
  }
  return data;
}
const rpc = (fn, args) => api('/rest/v1/rpc/' + fn, { method: 'POST', body: args || {} });

let refreshing = null;
async function ensureToken(){
  if (!S.session) throw Object.assign(new Error('Niet ingelogd'), { auth: true });
  if (S.session.expires_at * 1000 - 60000 < Date.now()) await refreshToken();
}
function refreshToken(){
  if (!refreshing) refreshing = (async () => {
    try {
      const res = await fetch(CFG.supabaseUrl + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: CFG.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: S.session.refresh_token }) });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (res.status >= 400 && res.status < 500) { S.session.expired = true; saveS(); render(); } // opnieuw inloggen; gegevens + wachtrij blijven bewaard
        throw Object.assign(new Error('Sessie verlopen, log opnieuw in'), { auth: true });
      }
      setSession(d);
    } finally { refreshing = null; }
  })();
  return refreshing;
}
function setSession(d){
  S.session = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600), email: d.user ? d.user.email : (S.session && S.session.email) };
  if (d.user) S.newUserId = d.user.id;
  saveS();
}
const appUrl = () => location.origin + location.pathname;
// redirect_to: als de mail een inloglink bevat (standaardmail van Supabase), komt die terug in de app
async function sendCode(email){
  if (DEV_CODE) return; // lokaal: geen mail, de code is altijd DEV_CODE
  await api('/auth/v1/otp?redirect_to=' + encodeURIComponent(appUrl()), { method: 'POST', auth: false, body: { email, create_user: true } });
}
// Lokaal inloggen: achter de schermen een wachtwoord-account op de lokale Supabase (aangemaakt bij de eerste keer).
async function devLogin(email, token){
  if (token !== DEV_CODE) throw new Error(`Lokaal is de code altijd ${DEV_CODE}.`);
  const password = 'lokaal-' + DEV_CODE;
  const call = async (path) => {
    try { return await api(path, { method: 'POST', auth: false, body: { email, password } }); }
    catch (e) { if (e instanceof TypeError) throw new Error('De lokale Supabase draait niet. Start hem met: npx supabase start'); throw e; }
  };
  try { setSession(await call('/auth/v1/token?grant_type=password')); return; }
  catch (e) { if (e.status !== 400) throw e; }
  try {
    const d = await call('/auth/v1/signup');
    if (!d || !d.access_token) throw new Error('De lokale Supabase vraagt om e-mailbevestiging. Zet in supabase/config.toml enable_confirmations = false.');
    setSession(d);
  } catch (e) {
    if (/already|registered|exists/i.test(e.message)) throw new Error('Dit adres bestaat lokaal al zonder vaste code. Kies een ander adres of wis de lokale database: npx supabase db reset');
    throw e;
  }
}
async function verifyCode(email, token){
  if (DEV_CODE) { await devLogin(email, token); await afterLogin(); return; }
  const d = await api('/auth/v1/verify', { method: 'POST', auth: false, body: { type: 'email', email, token } });
  setSession(d);
  await afterLogin();
}
// Inloggen via de link in de mail: Supabase stuurt terug naar de app met #access_token=…
async function loginFromLink(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get('access_token') && !h.get('error_description')) return false;
  history.replaceState(null, '', appUrl());
  if (h.get('error_description')) { toast('Inloggen mislukt: ' + h.get('error_description'), null, null, 'err'); return false; }
  let claims = {};
  try { claims = JSON.parse(atob(h.get('access_token').split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch (e) {}
  setSession({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_at: +h.get('expires_at') || undefined, expires_in: +h.get('expires_in') || undefined, user: { id: claims.sub, email: claims.email } });
  await afterLogin();
  return true;
}
async function afterLogin(){
  if (S.userId && S.userId !== S.newUserId) wipeLocal(); // andere gebruiker op deze telefoon
  S.userId = S.newUserId; delete S.newUserId;
  const teams = await rpc('my_teams');
  S.teams = teams || [];
  if (S.team && !S.teams.some(t => t.team_id === S.team.id)) S.team = null;
  saveS();
}
function wipeLocal(){
  db = emptyDb(); H = {}; S.outbox = {}; S.team = null; S.lastPull = null; S.settingsU = null;
  saveH(); saveS(); save(true, true);
}
async function logout(){
  if (!(await confirmSheet('Uitloggen?', pendingCount() ? `${pendingCount()} wijziging(en) zijn nog niet verstuurd (geen internet?) en gaan dan verloren.` : 'Je gegevens blijven bewaard bij je team.', 'Log uit', true))) return;
  const tok = S.session && S.session.access_token;
  if (tok) fetch(CFG.supabaseUrl + '/auth/v1/logout', { method: 'POST', headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + tok } }).catch(() => {});
  wipeLocal();
  S = Object.assign(S, { session: null, userId: null, teams: [] }); saveS();
  ui = { view: 'login' }; fixDate(); saveUi(); render();
}

// Bezoeken krijgen een vaste sleutel per huis per dag, zodat twee telefoons hetzelfde bezoek niet dubbel aanmaken.
function rekeyVisits(){
  const m = new Map();
  for (const v of db.visits) { const id = `${v.addressId}_${v.date}`, ex = m.get(id); v.id = id; if (!ex || (v.ts || 0) >= (ex.ts || 0)) m.set(id, v); }
  db.visits = [...m.values()];
}
const hasLocalData = () => db.addresses.length > 0 || db.visits.length > 0;

async function createTeam(name, memberName){
  const id = await rpc('create_team', { p_name: name, p_member_name: memberName });
  S.team = { id, name, role: 'admin', memberName };
  S.teams = await rpc('my_teams');
  rekeyVisits();
  H = {}; S.outbox = {}; S.lastPull = null; S.settingsU = null;
  saveS(); save(true);            // alles wat op deze telefoon staat gaat in de wachtrij → naar het team
  await syncNow();
}
async function chooseTeam(t){
  db = emptyDb(); H = {}; S.outbox = {}; S.lastPull = null; S.settingsU = null;
  S.team = { id: t.team_id, name: t.team_name, role: t.role, memberName: t.member_name };
  saveH(); saveS(); save(true, true);
  await syncNow();
}
async function joinTeam(code, memberName){
  await rpc('join_team', { p_code: code, p_member_name: memberName });
  S.teams = await rpc('my_teams');
  const t = S.teams[S.teams.length - 1];
  await chooseTeam(S.teams.find(x => x.team_id === t.team_id));
}

function scheduleSync(ms){ clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms || 0); }
async function syncNow(){
  if (!syncOn() || syncing) return;
  if (!navigator.onLine) { syncBadge(); return; }
  syncing = true; syncBadge();
  try {
    await push(); await pull(); if (pendingCount()) await push();
    syncErr = null; S.lastSync = new Date().toISOString();
  } catch (e) { syncErr = e; console.warn('sync', e); }
  finally { syncing = false; saveS(); syncBadge(); }
}
async function push(){
  const entries = Object.values(S.outbox);
  if (!entries.length) return;
  const done = e => { const key = e.t + ':' + e.k; if (S.outbox[key] === e) delete S.outbox[key]; };
  const st = entries.find(e => e.t === 'settings');
  if (st) {
    if (S.team.role === 'admin') await api(`/rest/v1/teams?id=eq.${S.team.id}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: Object.assign({}, st.row, { settings_updated_at: st.u }) });
    done(st);
  }
  for (const t of TABLES) for (const del of [false, true]) {
    const list = entries.filter(e => e.t === t && !!e.del === del);
    for (let i = 0; i < list.length; i += 500) {
      const chunk = list.slice(i, i + 500);
      await api(`/rest/v1/${t}?on_conflict=${CONFLICT[t]}`, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: chunk.map(e => Object.assign({}, e.row, { team_id: S.team.id, updated_at: e.u, deleted: del })) });
      chunk.forEach(done); saveS();
    }
  }
}
async function pull(){
  const tid = S.team.id;
  const since = S.lastPull ? new Date(tsMs(S.lastPull) - 60000).toISOString() : null; // minuut overlap: veilig, samenvoegen is herhaalbaar
  let maxTs = S.lastPull, changed = false;
  const teams = await api(`/rest/v1/teams?id=eq.${tid}&select=*`);
  if (!teams || !teams.length) { S.team = null; saveS(); toast('Je bent geen lid meer van dit team.'); render(); return; }
  const team = teams[0];
  S.team.name = team.name;
  const pend = S.outbox['settings:team'];
  if ((!S.settingsU || tsMs(team.settings_updated_at) > tsMs(S.settingsU)) && !(pend && tsMs(pend.u) > tsMs(team.settings_updated_at))) {
    Object.assign(db.settings, { walkDays: team.walk_days || [], orderRound: team.order_round || 1, absenceScript: team.absence_script || '' });
    S.settingsU = team.settings_updated_at; if (pend) delete S.outbox['settings:team']; changed = true;
  }
  for (const t of TABLES) {
    for (let off = 0; ; off += 1000) {
      const rows = await api(`/rest/v1/${t}?team_id=eq.${tid}${since ? '&server_ts=gt.' + encodeURIComponent(since) : ''}&order=server_ts.asc&limit=1000&offset=${off}`);
      for (const r of rows) { if (mergeRow(t, r)) changed = true; if (!maxTs || tsMs(r.server_ts) > tsMs(maxTs)) maxTs = r.server_ts; }
      if (rows.length < 1000) break;
    }
  }
  if (changed) sortAddresses();
  S.lastPull = maxTs || team.server_ts; // servertijd, niet de klok van de telefoon
  saveS();
  if (changed) { save(true, true); safeRender(); }
}
let pulledSort = {};
function mergeRow(t, r){
  const k = t === 'absences' ? r.date : t === 'orders' ? r.week_start : r.id;
  const key = t + ':' + k, pend = S.outbox[key];
  if (pend && tsMs(pend.u) > tsMs(r.updated_at)) return false; // eigen nieuwere wijziging wacht nog
  if (pend) delete S.outbox[key];
  if (t === 'addresses') {
    const i = db.addresses.findIndex(a => a.id === r.id);
    if (r.deleted) { if (i < 0) return false; db.addresses.splice(i, 1); return true; }
    const a = { id: r.id, street: r.street, number: r.number, name: r.name, note: r.note, prefDays: r.pref_days || [], excluded: r.excluded };
    if (i < 0) db.addresses.push(a); else Object.assign(db.addresses[i], a);
    pulledSort[r.id] = r.sort; return true;
  }
  if (t === 'visits') {
    const i = db.visits.findIndex(v => v.id === r.id);
    if (r.deleted) { if (i < 0) return false; db.visits.splice(i, 1); return true; }
    const v = { id: r.id, addressId: r.address_id, date: r.date, status: r.status, eggs: r.eggs, nextDate: r.next_date, nextEggs: r.next_eggs, nextManual: r.next_manual, note: r.note, double: r.double, offered: r.offered, ts: tsMs(r.updated_at) };
    if (i < 0) db.visits.push(v); else db.visits[i] = Object.assign(db.visits[i], v);
    return true;
  }
  if (t === 'absences') {
    const has = db.absences.includes(r.date);
    if (r.deleted === has) { db.absences = r.deleted ? db.absences.filter(d => d !== r.date) : [...db.absences, r.date].sort(); return true; }
    return false;
  }
  if (t === 'orders') {
    if (r.deleted) { if (!(r.week_start in db.orders)) return false; delete db.orders[r.week_start]; return true; }
    db.orders[r.week_start] = r.amount; return true;
  }
}

}

/* ---------- afspraken ---------- */
const DEC = v => v.status !== 'nothome';                 // koop / geen eieren = beslissend bezoek
const agEggs = v => v ? (v.nextEggs ?? v.eggs ?? 0) : 0;   // afgesproken aantal voor volgende keer
const weeksOf = v => (v && v.nextDate) ? Math.max(1, weeksBetween(v.date, v.nextDate)) : null;
const isAbsent = d => db.absences.includes(d);
function lastDecisive(vs, before){ let r = null; for (const v of vs) { if (v.date >= before) break; if (DEC(v)) r = v; } return r; }
// Een bezoek "sluit de week af", behalve als er is afgesproken later in dezelfde week terug te komen.
const isFinal = (v, WE) => DEC(v) && !(v.nextDate && v.nextDate > v.date && v.nextDate <= WE);
const walkDaysSorted = () => db.settings.walkDays.slice().sort(byMon);
const walkDates = T => walkDaysSorted().map(d => addDays(T, monIdx(d)));
const prefsOf = a => (a.prefDays || []).filter(d => db.settings.walkDays.includes(d)).sort(byMon);

// Standaard volgende datum: voorkeursdag in de doelweek; is de bezorger dan afwezig, de eerstvolgende loopdag waarop wél gelopen wordt.
function nextCandidates(a, D, k){
  const T = addDays(weekStart(D), 7 * k);
  let c = [...prefsOf(a).map(d => addDays(T, monIdx(d)))];
  if (db.settings.walkDays.includes(dow(D))) c.push(addDays(T, monIdx(dow(D))));
  c.push(...walkDates(T));
  c = [...new Set(c)];
  if (k === 0) c = c.filter(x => x > D);
  return c;
}
function defaultNext(a, D, k){
  if (!db.settings.walkDays.length) return addDays(D, 7 * Math.max(1, k));
  const c = nextCandidates(a, D, k);
  return c.find(x => !isAbsent(x)) || c[0] || addDays(D, 7 * Math.max(1, k));
}
// Valt de vaste dag van deze klant bij het volgende bezoek op een dag dat de bezorger afwezig is?
function nextVisitImpact(a, D){
  if (!db.settings.walkDays.length || !db.absences.length) return null;
  const ag = lastDecisive(visitsOf(a.id), D);
  const k = weeksOf(ag) || 1;
  const c = nextCandidates(a, D, k);
  if (!c.length || !isAbsent(c[0])) return null;
  const T = addDays(weekStart(D), 7 * k);
  return { k, T, date: c[0], alt: c.find(x => !isAbsent(x)) || null, days: walkDates(T), agreed: agEggs(ag) };
}
const DEFAULT_SCRIPT = 'Volgende week kan ik op {dag} niet langskomen. Onze eieren blijven veel langer vers dan eieren uit de supermarkt. Wilt u deze keer voor 2 weken nemen?';

/* ---------- route van de dag ---------- */
function plan(D){
  const W = weekStart(D), WE = addDays(W, 6), di = monIdx(dow(D));
  const shown = [], hidden = [];
  db.addresses.forEach((a, i) => {
    if (a.excluded) return;
    const vs = visitsOf(a.id);
    const today = vs.find(v => v.date === D) || null;
    const earlier = vs.filter(v => v.date >= W && v.date < D);
    const done = earlier.filter(v => isFinal(v, WE)).pop();
    const nothome = earlier.filter(v => v.status === 'nothome');
    const ag = lastDecisive(vs, D);
    const badges = [];
    let show = true, reason = '';
    if (nothome.length) badges.push(['bad', 'Niet thuis op ' + nothome.map(v => DSH[dow(v.date)]).join(', ')]);
    if (done) { show = false; reason = `Al gedaan op ${fmtShort(done.date)}`; }
    else if (ag && ag.nextDate && ag.nextDate > WE) { show = false; reason = `Volgende keer: ${fmtShort(ag.nextDate)}`; }
    else if (ag && ag.nextDate && ag.nextDate >= W) {
      // afspraak valt in deze week: die dag telt, niet de voorkeursdag
      if (ag.nextDate > D) { show = false; reason = `Afgesproken op ${fmtShort(ag.nextDate)}`; }
      else if (ag.nextDate < D && !nothome.length) badges.push(['info', `Inhalen: afspraak was ${DSH[dow(ag.nextDate)]}${isAbsent(ag.nextDate) ? ' (afwezig)' : ''}`]);
    } else {
      const prefs = prefsOf(a);
      if (prefs.length) {
        if (!prefs.some(d => monIdx(d) <= di)) { show = false; reason = 'Voorkeur ' + prefs.map(d => DAYS[d]).join(' of '); }
        else if (!prefs.includes(dow(D)) && !nothome.length) {
          const missed = prefs.filter(d => monIdx(d) < di);
          badges.push(['info', 'Inhalen van ' + missed.map(d => DSH[d] + (isAbsent(addDays(W, monIdx(d))) ? ' (afwezig)' : '')).join(', ')]);
        }
      }
      if (ag && ag.nextDate && ag.nextDate < W) badges.push(['grey', `Gepland was ${fmtShort(ag.nextDate)}`]);
    }
    const it = { a, i, today, badges, ag, exp: ag ? agEggs(ag) : null, reason };
    if (today || show) shown.push(it); else hidden.push(it);
  });
  return { shown, hidden };
}

/* ---------- voorspelling ---------- */
// Per adres: wat verwachten we in week T?
function forecast(T){
  const TE = addDays(T, 6), rows = [];
  for (const a of db.addresses) {
    const vs = visitsOf(a.id);
    const inT = vs.filter(v => v.date >= T && v.date <= TE);
    if (inT.some(v => isFinal(v, TE))) {
      rows.push({ a, kind: 'verkocht', eggs: sum(inT.filter(DEC), v => v.eggs || 0), date: inT.filter(DEC).pop().date });
      continue;
    }
    if (a.excluded) continue;
    const ag = lastDecisive(vs, addDays(TE, 1));
    if (!ag) { rows.push({ a, kind: 'nieuw', eggs: 0 }); continue; }
    let n = ag.nextDate; const e = agEggs(ag);
    if (!n || n > TE) continue;
    if (n >= T) { rows.push({ a, kind: 'afgesproken', eggs: e, date: n }); continue; }
    if (daysBetween(n, T) > 56) { rows.push({ a, kind: 'onzeker', eggs: 0 }); continue; }
    const k = weeksOf(ag) || 1;
    while (n < T) n = addDays(n, 7 * k);
    if (n <= TE) {
      // ritme doorgetrokken; valt dat op een afwezige dag, dan schuift het (net als in de app) naar een loopdag
      if (db.settings.walkDays.length && (isAbsent(n) || !db.settings.walkDays.includes(dow(n)))) {
        const alt = defaultNext(a, addDays(T, -7), 1); if (alt >= T && alt <= TE) n = alt;
      }
      rows.push({ a, kind: 'verwacht', eggs: e, date: n });
    }
  }
  return rows;
}
// Hoe betrouwbaar waren de afspraken in de afgelopen (max 8) afgeronde weken?
function realisation(beforeWeek){
  let agreed = 0, got = 0, extra = 0, weeks = 0;
  const perWeek = [];
  for (let k = 8; k >= 1; k--) {
    const w = addDays(beforeWeek, -7 * k), wE = addDays(w, 6);
    let wa = 0, wg = 0, wx = 0, any = false;
    for (const a of db.addresses) {
      const vs = visitsOf(a.id);
      const inW = vs.filter(v => v.date >= w && v.date <= wE);
      const sold = sum(inW.filter(DEC), v => v.eggs || 0);
      if (inW.length) any = true;
      const ag = lastDecisive(vs, w);
      if (ag && ag.nextDate && ag.nextDate >= w && ag.nextDate <= wE) {
        // "voor 2 weken" genomen: het extra deel was een bewuste keuze, geen afwijking van de afspraak
        const dbl = inW.some(v => v.double) ? Math.max(0, sold - agEggs(ag)) : 0;
        wa += agEggs(ag) + dbl; wg += sold;
      }
      else wx += sold;
    }
    perWeek.push({ w, agreed: wa, sold: wg + wx });
    if (any) { weeks++; agreed += wa; got += wg; extra += wx; }
  }
  return { ratio: agreed ? got / agreed : null, extraPerWeek: weeks ? extra / weeks : 0, weeks, perWeek };
}
const soldIn = (T) => { const TE = addDays(T, 6); return sum(db.visits.filter(v => v.date >= T && v.date <= TE && DEC(v)), v => v.eggs || 0); };

}
function homeRow(x, n, im){

/* ---------- Huis (aan de deur) ---------- */
function vHouse(){
  const D = ui.date, a = byId(ui.id);
  if (!a) { ui.view = 'home'; return vHome(); }
  const p = plan(D);
  const pos = p.shown.findIndex(x => x.a.id === a.id);
  const item = p.shown[pos] || p.hidden.find(x => x.a.id === a.id);
  const vs = visitsOf(a.id), v = vs.find(x => x.date === D);
  const before = vs.filter(x => x.date < D), last4 = before.slice(-4).reverse();
  const ag = lastDecisive(vs, D), agreed = ag ? agEggs(ag) : 0, pw = weeksOf(ag);
  const imp = pos >= 0 ? nextVisitImpact(a, D) : null; // buiten de ronde (bijv. al gedaan): geen aanbod
  let h = navBar({ left: backBtn('tab', 'Ronde', 'data-v="home"'), title: pos >= 0 ? `${pos + 1} van ${p.shown.length}` : 'Buiten de ronde', right: `<button class="nb" data-act="housemenu" aria-label="Meer acties">${I('more')}</button>` });
  h += '<main class="house-main">';
  const sub = [];
  if (a.name) sub.push(esc(a.name));
  const prefs = (a.prefDays || []).slice().sort(byMon);
  if (prefs.length) sub.push('voorkeur ' + prefs.map(d => DAYS[d]).join(' / '));
  let badges = item ? item.badges.map(b => `<span class="badge ${b[0] === 'bad' ? 'red' : b[0] === 'info' ? 'blue' : 'gray'}">${esc(b[1])}</span>`).join('') : '';
  if (pos < 0 && item && item.reason) badges += `<span class="badge gray">${esc(item.reason)}</span>`;
  if (a.excluded) badges += '<span class="badge red">Uitgesloten van de route</span>';
  h += `<div class="addr"><h1 tabindex="-1">${esc(label(a))}</h1>${sub.length ? `<div class="sub">${sub.join(' · ')}</div>` : ''}${badges ? `<div>${badges}</div>` : ''}</div>`;
  if (a.note) h += `<div class="callout">${I('note')}<div>${esc(a.note)}</div></div>`;

  if (imp) {
    const dayTxt = `${DAYS[dow(imp.date)]} ${pd(imp.date).getDate()} ${MONL[pd(imp.date).getMonth()]}`;
    const script = (db.settings.absenceScript || DEFAULT_SCRIPT).replace(/\{dag\}/g, dayTxt);
    const isAlt = v && !v.double && DEC(v) && imp.alt && v.nextDate === imp.alt;
    h += `<div class="absc mb"><div class="h">${I('warn')}<span>${imp.k === 1 ? 'Volgende week' : 'Bij het volgende bezoek'} geen ronde op hun dag (${esc(dayTxt)})</span></div>
      <div class="wk">${imp.days.map(d => `<div class="${isAbsent(d) ? 'x' : ''}"><b>${DSH[dow(d)]} ${pd(d).getDate()}</b><span>${isAbsent(d) ? 'geen ronde' : 'wel ronde'}</span>${d === imp.date ? '<em>hun dag</em>' : ''}</div>`).join('')}</div>
      <div class="script">“${esc(script)}”</div>
      ${imp.alt && !(v && v.status === 'nothome') ? `<button class="btn gray" data-act="altday" data-date="${imp.alt}">${isAlt ? I('check') : ''}Liever andere dag: ${esc(fmtShort(imp.alt))}</button>` : ''}
      ${!imp.alt ? '<p class="sec-f" style="padding:0">Die hele week is er geen ronde.</p>' : ''}</div>`;
  }

  // de afspraak (of wat er vandaag genoteerd is) groot in beeld
  let hero;
  if (v && v.status === 'nothome') hero = `<div class="lbl">Vandaag</div><div class="big red"><b>Niet thuis</b></div><div class="meta">De afspraak blijft staan${ag ? ` (${agreed} eieren)` : ''}.</div>`;
  else if (v) hero = `<div class="lbl">Vandaag genoteerd</div><div class="big green"><b>${v.eggs}</b><span>${v.eggs === 1 ? 'ei' : 'eieren'}</span></div><div class="meta">${ag ? `Afspraak was ${agreed}` : 'Eerste keer'}${v.double ? ' · voor 2 weken' : ''}</div>`;
  else if (ag) hero = `<div class="lbl">Afgesproken</div><div class="big"><b>${agreed}</b><span>eieren</span></div><div class="meta">${pw === 1 ? 'Elke week' : `Om de ${pw} weken`}${ag.nextDate && ag.nextDate !== D ? ` · was gepland ${esc(fmtShort(ag.nextDate))}` : ''}${ag.note ? ` · <i>${esc(ag.note)}</i>` : ''}</div>`;
  else hero = `<div class="lbl">Nieuw adres</div><div class="big"><b>–</b></div><div class="meta">Nog geen afspraak. Kies hieronder hoeveel.</div>`;
  h += `<div class="grp"><div class="hero">${hero}</div>`;
  if (before.length) {
    h += '<div class="strip" aria-label="Laatste 4 keer">';
    for (let k = 0; k < 4; k++) {

      if (!x) { h += '<div class="mt empty"><span class="d">&nbsp;</span><span class="v">–</span></div>'; continue; }
      const cls = x.status === 'nothome' ? 'nh' : x.status === 'sold' ? 'sold' : '';
      h += `<div class="mt ${cls}"><span class="d">${esc(fmtShort(x.date))}</span><span class="v">${x.status === 'nothome' ? '✗' : x.eggs}</span></div>`;
    }
    h += '</div>';
  }
  h += '</div>';

  // ander aantal
  const nhOn = v && v.status === 'nothome';
  if (!nhOn) {
    h += sec(ag ? 'Ander aantal' : 'Aantal', grp(`<div class="cell stack">
      <div class="stepper"><button data-act="minus" aria-label="Eén minder">${I('minus')}</button>
        <div class="val"><b class="num">${v ? v.eggs : ag ? agreed : 0}</b><span>${v ? 'genoteerd' : 'eieren'}</span></div>
        <button data-act="plus" aria-label="Eén meer">${I('plus')}</button></div>
      <div class="chips grid7">${[0, 6, 10, 12, 15, 20, 30].map(n => chip(n === 0 ? 'Geen' : n, 'eggs', `data-n="${n}"`, v && v.eggs === n && (n ? v.status === 'sold' : v.status === 'none'))).join('')}</div></div>`));
  }
  // volgende keer: één regel, details in een paneel
  if (v && DEC(v)) {
    const k = Math.max(0, weeksBetween(D, v.nextDate));
    const pref = nextCandidates(a, D, k)[0];
    const moved = pref && pref !== v.nextDate && isAbsent(pref);
    h += sec('', grp(`<button class="cell" data-act="opensheet" data-s="next"><span class="ico" style="background:var(--blue)">${I('cal')}</span>
        <span class="tx"><span class="tt">Volgende keer</span>${moved ? `<span class="st" style="color:var(--red)">${esc(fmtShort(pref))} geen ronde → verplaatst</span>` : ''}</span>
        <span class="tr">${esc(fmtShort(v.nextDate))} · ${v.nextEggs ?? 0}</span>${chev()}</button>
      <button class="cell" data-act="opensheet" data-s="next"><span class="ico" style="background:var(--gray)">${I('note')}</span><span class="tx"><span class="tt">Notitie</span>${v.note ? `<span class="st one">${esc(v.note)}</span>` : ''}</span>${v.note ? '' : '<span class="tr">Toevoegen</span>'}${chev()}</button>`));
  }
  h += '<p class="sec-f" style="text-align:center;padding-top:18px">Veeg opzij voor het vorige of volgende huis.</p>';
  h += '</main>';

  // actiebalk onder de duim
  const prev = `<button class="iconbtn" data-act="prev" aria-label="Vorig huis">${I('chevL')}</button>`;
  if (!v) {

    else if (ag && agreed > 0) primary = `<button class="btn stack" data-act="samenext">Zoals afgesproken<small>${agreed} eieren · volgende</small></button>`;
    else primary = `<button class="btn" data-act="next">Volgende${I('chevR')}</button>`;
    h += `<div class="dock">${prev}<button class="btn gray red" data-act="nhnext">Niet thuis</button>${primary}</div>`;
  } else {
    h += `<div class="dock two">${prev}<button class="btn" data-act="next">Volgende${I('chevR')}</button></div>`;
  }
  return h;
}

/* paneel: volgende keer + notitie */
function sheetNext(){
  const D = ui.date, a = byId(ui.id), v = curVisit();
  if (!a || !v || !DEC(v)) { ui.sheet = null; return ''; }
  const W = weekStart(D), kSel = v.nextDate ? weeksBetween(D, v.nextDate) : null;
  const laterThisWeek = walkDates(W).some(x => x > D);
  const weeks = [...(laterThisWeek ? [0] : []), 1, 2, 3, 4];
  let dayChips = [];
  if (kSel != null && kSel >= 0 && kSel <= 4 && db.settings.walkDays.length) dayChips = walkDates(addDays(W, 7 * kSel)).filter(x => kSel > 0 || x > D);
  const custom = v.nextDate && !dayChips.includes(v.nextDate);
  const k = Math.max(0, weeksBetween(D, v.nextDate));
  const pref = nextCandidates(a, D, k)[0];
  const moved = pref && pref !== v.nextDate && isAbsent(pref);
  let h = `<div class="sheet-h"><span></span><div class="nav-t">Volgende keer</div><div class="nav-r"><button class="nb bold" data-act="closesheet">Gereed</button></div></div><div class="sheet-c">`;
  h += sec('Hoeveel eieren', grp(`<div class="cell stack"><div class="stepper"><button data-act="nminus" aria-label="Eén minder">${I('minus')}</button>
      <div class="val"><b class="num">${v.nextEggs ?? 0}</b><span>eieren</span></div><button data-act="nplus" aria-label="Eén meer">${I('plus')}</button></div>
      <div class="chips grid7">${[0, 6, 10, 12, 15, 20, 30].map(n => chip(n, 'negg', `data-n="${n}"`, v.nextEggs === n)).join('')}</div></div>`));
  h += sec('Wanneer', grp(`<div class="cell stack"><div class="segc" role="group" aria-label="Over hoeveel weken">${weeks.map(n => `<button data-act="nweek" data-n="${n}" aria-pressed="${kSel === n}">${n === 0 ? 'Deze week' : n === 1 ? '1 week' : n + ' wkn'}</button>`).join('')}</div>
      ${dayChips.length ? `<div class="chips">${dayChips.map(x => isAbsent(x) ? `<button class="chip abs" disabled aria-label="${esc(fmtShort(x))}, geen ronde">${esc(fmtShort(x))}</button>` : chip(esc(fmtShort(x)), 'nday', `data-date="${x}"`, v.nextDate === x)).join('')}</div>` : ''}</div>
      <label class="cell field"><span class="fl">Andere datum</span><input type="date" data-field="nextDate" value="${esc(custom ? v.nextDate : '')}" min="${addDays(D, 1)}"></label>`),
    `${moved ? `${esc(fmtShort(pref))} is er geen ronde. ` : ''}Volgende keer: <b>${esc(fmtLong(v.nextDate))}</b>, ${v.nextEggs ?? 0} eieren.`);
  h += sec('Notitie bij dit bezoek', grp(`<div class="cell"><textarea class="ta" data-field="vnote" placeholder="Bijv. betaalt volgende keer, liever grote eieren">${esc(v.note || '')}</textarea></div>`));
  return h + '</div>';

/* ---------- Planning ---------- */
function vOrder(){
  const T = ui.ow, cur = weekStart(todayStr());
  const rows = forecast(T), r = realisation(cur);
  const enough = r.weeks >= 3 && r.ratio != null;
  const ratio = enough ? Math.min(1.1, Math.max(0.5, r.ratio)) : 1;
  const sold = sum(rows.filter(x => x.kind === 'verkocht'), x => x.eggs);
  const agreed = rows.filter(x => x.kind === 'afgesproken'), proj = rows.filter(x => x.kind === 'verwacht');
  const sA = sum(agreed, x => x.eggs), sP = sum(proj, x => x.eggs);
  const exact = sold + (sA + sP) * ratio;
  const rnd = db.settings.orderRound || 1;
  const advice = Math.round(exact / rnd) * rnd;
  const nNew = rows.filter(x => x.kind === 'nieuw').length, nUnsure = rows.filter(x => x.kind === 'onzeker').length;
  const dblRows = [...agreed, ...proj].filter(x => x.date && nextVisitImpact(x.a, x.date));
  const dblExtra = sum(dblRows, x => x.eggs);
  const dblDays = [...new Set(dblRows.map(x => nextVisitImpact(x.a, x.date).date))].sort();
  const adviceDbl = Math.round((exact + dblExtra * ratio) / rnd) * rnd;
  const offered = db.visits.filter(v => v.offered && v.date >= addDays(cur, -182));
  const acc = offered.length >= 5 ? offered.filter(v => v.double).length / offered.length : null;
  const adviceAcc = acc != null ? Math.round((exact + dblExtra * acc * ratio) / rnd) * rnd : null;
  const adviceMain = adviceAcc ?? advice;
  const rel = T === cur ? 'deze week' : T === addDays(cur, 7) ? 'volgende week' : T < cur ? 'voorbij' : `over ${weeksBetween(cur, T)} weken`;

  let h = navBar({ right: syncButton() }) + '<main>' + largeTitle('Planning');
  h += `<div class="pager"><button class="nb" data-act="ow" data-n="-1" aria-label="Vorige week">${I('chevL')}</button>
    <div class="mid"><b>Week ${isoWeek(T)}</b><span>${esc(weekLabel(T))} · ${rel}</span></div>
    <button class="nb" data-act="ow" data-n="1" aria-label="Volgende week">${I('chevR')}</button></div>`;
  h += `<div class="grp"><div class="hero order"><div class="lbl">Besteladvies</div><div class="big"><b>${adviceMain}</b><span>eieren</span></div>
    <div class="meta">${enough ? `${Math.round(r.ratio * 100)}% van de afspraken werd de afgelopen ${r.weeks} weken echt verkocht` : 'Nog weinig historie: gerekend met 100% van de afspraken'}</div></div>
    <button class="cell" data-act="togglecalc" aria-expanded="${!!ui.showCalc}"><span class="tx"><span class="tt" style="color:var(--tint)">Hoe berekend</span></span><span style="display:inline-flex;transform:rotate(${ui.showCalc ? 90 : 0}deg);transition:transform .2s">${I('chevR', 'chev')}</span></button>`;
  if (ui.showCalc) {
    const line = (t, n) => `<div class="cell"><span class="tx"><span class="tt">${t}</span></span><span class="tr">${n}</span></div>`;
    h += (sold ? line('Al verkocht deze week', sold) : '') + line(`Afgesproken (${plural(agreed.length, 'adres', 'adressen')})`, sA) + line(`Vast ritme, nog niet bezocht (${proj.length})`, sP)
      + line('Realisatie', enough ? Math.round(r.ratio * 100) + '%' : '100%') + line(`Berekend${rnd > 1 ? `, afgerond op ${rnd}` : ''}`, Math.round(exact))
      + `<div class="cell"><span class="tx"><span class="st">Niet meegeteld, om niet te veel te bestellen: ${nNew ? `${plural(nNew, 'nieuw adres', 'nieuwe adressen')} · ` : ''}${nUnsure ? `${nUnsure} lang niet bezocht · ` : ''}gemiddeld ${Math.round(r.extraPerWeek)} per week buiten afspraken om.</span></span></div>`;
  }
  h += '</div>';
  if (dblRows.length) {
    h += `<div class="banner red mt12">${I('warn')}<div><b>Geen ronde op ${dblDays.map(fmtShort).join(', ')}.</b> ${plural(dblRows.length, 'klant kan', 'klanten kunnen')} deze week voor 2 weken nemen: <b class="num">+${dblExtra}</b>.
      ${acc != null ? `Eerder zei ${Math.round(acc * 100)}% ja (${offered.length}× aangeboden); daar rekent het advies mee.` : `Als iedereen ja zegt: <b class="num">${adviceDbl}</b>. Het advies rekent met niemand, tot er 5× is aangeboden.`}</div></div>`;
  }
  const P = addDays(T, -7);
  let foot = db.orders[T] != null ? (db.orders[T] - adviceMain > 0 ? `${db.orders[T] - adviceMain} meer dan het advies.` : db.orders[T] - adviceMain < 0 ? `${adviceMain - db.orders[T]} minder dan het advies.` : 'Gelijk aan het advies.') : 'Vul in wat je echt hebt besteld; zo zie je later wat er over bleef.';
  if (db.orders[P] != null) {
    let left = db.orders[P] - soldIn(P);
    if (P >= cur) left -= sum(forecast(P).filter(x => x.kind !== 'verkocht'), x => x.eggs);
    foot += ` Restant week ${isoWeek(P)}: ${left}${left > 0 ? ` (advies min restant: ${Math.max(0, Math.round((exact - left) / rnd) * rnd)})` : ''}.`;
  }
  h += sec('', grp(`<label class="cell field"><span class="fl">Besteld</span><input type="number" inputmode="numeric" min="0" data-field="order" placeholder="aantal" value="${db.orders[T] ?? ''}"></label>`), foot);

  const days = walkDates(T);
  if (days.length) {
    h += sec('Loopdagen', grp(days.map(d => {
      const rs = rows.filter(x => x.date === d && x.kind !== 'nieuw' && x.kind !== 'onzeker');
      const ab = isAbsent(d);
      return `<div class="cell"><span class="tx"><span class="tt" ${ab ? 'style="color:var(--red)"' : ''}>${esc(fmtLong(d))}</span>
        <span class="st" ${ab && rs.length ? 'style="color:var(--red)"' : ''}>${ab ? (rs.length ? `Geen ronde · spreek met ${plural(rs.length, 'adres', 'adressen')} een andere dag af` : 'Geen ronde') : `${plural(rs.length, 'adres', 'adressen')} · ${sum(rs, x => x.eggs)} eieren`}</span></span>
        ${toggleBtn(!ab, 'absent', `data-date="${d}"`, `Ronde op ${fmtLong(d)}`)}</div>`;
    }).join('')), 'Zet een dag uit als de bezorger dan niet loopt. Dat is meteen zichtbaar in de ronde en bij elk bezoek.');
  } else h += sec('Loopdagen', '', 'Stel eerst de loopdagen in bij Instellingen.');

  const listed = rows.filter(x => x.kind !== 'nieuw' && x.kind !== 'onzeker').sort((x, y) => (x.date || '') < (y.date || '') ? -1 : 1);
  const kl = { verkocht: 'verkocht', afgesproken: 'afgesproken', verwacht: 'vast ritme' };
  h += `<section class="sec"><button class="sec-h tog ${ui.showRows ? 'open' : ''}" data-act="togglerows" aria-expanded="${!!ui.showRows}">Per adres <span class="stat">${listed.length}</span>${I('chevR', 'sm')}</button>
    ${ui.showRows ? grp(listed.map(x => `<div class="cell"><span class="tx"><span class="tt">${esc(label(x.a))}</span><span class="st">${esc(fmtShort(x.date))} · ${kl[x.kind]}</span></span><span class="tr">${x.eggs}</span></div>`).join('') || '<div class="cell"><span class="st">Niets gepland.</span></div>') : ''}</section>`;
  const histWeeks = r.perWeek.filter(pw => pw.sold || pw.agreed || db.orders[pw.w] != null).reverse();
  h += `<section class="sec"><button class="sec-h tog ${ui.showHist ? 'open' : ''}" data-act="togglehist" aria-expanded="${!!ui.showHist}">Afgelopen weken${I('chevR', 'sm')}</button>
    ${ui.showHist ? grp(`<table class="h"><tr><th>Week</th><th>Besteld</th><th>Verkocht</th><th>Over</th></tr>${histWeeks.length ? histWeeks.map(pw => { const o = db.orders[pw.w]; return `<tr><td>${isoWeek(pw.w)}</td><td>${o ?? '–'}</td><td>${pw.sold}</td><td>${o != null ? (o - pw.sold > 0 ? '+' : '') + (o - pw.sold) : '–'}</td></tr>`; }).join('') : '<tr><td colspan="4" style="text-align:left;color:var(--label2)">Nog geen afgeronde weken.</td></tr>'}</table>`) : ''}</section>`;
  return h + '</main>' + tabs('order');
}

/* ---------- Route ---------- */
function vRoute(){
  const n = db.addresses.length, ex = db.addresses.filter(a => a.excluded).length;
  const editing = !!ui.routeEdit && n > 0;
  let h = navBar({ left: n ? `<button class="nb ${editing ? 'bold' : ''}" data-act="routeedit">${editing ? 'Gereed' : 'Wijzig'}</button>` : '', right: `${syncButton()}<button class="nb" data-act="new" aria-label="Adres toevoegen">${I('plus')}</button>` });

function bulkParse(text){
  const out = []; let street = '';
  for (let line of text.split(/\r?\n/)) {
    line = line.trim().replace(/\s+/g, ' ');
    if (!line) continue;
    let m = line.match(/^(.*?)\s*(\d+)\s*-\s*(\d+)(?:\s+(even|oneven))?$/i);
    if (m && (m[1] || street)) {
      const s = m[1] || street, from = +m[2], to = +m[3];
      if (Math.abs(to - from) > 500) continue;
      street = s;
      const step = m[4] ? 2 : 1, dir = to >= from ? 1 : -1;
      let start = from;
      if (m[4]) { const wantEven = m[4].toLowerCase() === 'even'; if ((start % 2 === 0) !== wantEven) start += dir; }
      for (let n = start; dir > 0 ? n <= to : n >= to; n += step * dir) out.push({ street: s, number: String(n) });
      continue;
    }
    m = line.match(/^(.*?)\s*(\d+[\w\-\/]*(?:\s[a-zA-Z])?)$/);
    if (m && (m[1] || street)) { street = m[1] || street; out.push({ street, number: m[2] }); continue; }
    out.push({ street: line, number: '' }); street = line;
  }
  return out;
}

function authAction(act, el){
  const run = async (fn) => { if (el) el.disabled = true; try { await fn(); } catch (e) { toast(e.message || String(e), null, null, 'err'); } finally { if (el && el.isConnected) el.disabled = false; } };
  const val = id => (document.getElementById(id) || {}).value || '';
  switch (act) {
    case 'sendcode': case 'resendcode': {
      const email = (val('loginEmail') || ui.loginEmail || '').trim().toLowerCase();
      if (!/^\S+@\S+\.\S+$/.test(email)) { toast('Vul een geldig e-mailadres in.', null, null, 'err'); return true; }
      run(async () => { await sendCode(email); ui.loginEmail = email; ui.loginSent = true; saveUi(); render(); toast(DEV_CODE ? `Lokaal: vul ${DEV_CODE} in` : 'Mail verstuurd'); const c = document.getElementById('loginCode'); if (c) c.focus(); });
      return true;
    }
    case 'verifycode': {
      const code = val('loginCode').replace(/\D/g, '');
      if (code.length < 6) { toast('Vul de code uit de mail in.', null, null, 'err'); return true; }
      run(async () => { await verifyCode(ui.loginEmail, code); ui.loginSent = false; saveUi(); render(); syncNow(); });
      return true;
    }
    case 'otheremail': ui.loginSent = false; saveUi(); render(); return true;
    case 'createteam': {
      const name = val('teamName').trim(), m = val('memberName1').trim();
      if (!name) { toast('Geef je eierbedrijf een naam.', null, null, 'err'); return true; }
      ui.memberName = m;
      run(async () => { await createTeam(name, m); go('home'); toast('Team aangemaakt'); });
      return true;
    }
    case 'jointeam': {
      const code = val('joinCode').trim(), m = val('memberName2').trim();
      if (!code) { toast('Vul de uitnodigingscode in.', null, null, 'err'); return true; }
      (hasLocalData() ? confirmSheet('Gegevens op deze telefoon vervangen?', 'Ze worden vervangen door die van het team.', 'Vervang', true) : Promise.resolve(true)).then(ok => {
        if (!ok) return; ui.memberName = m;
        run(async () => { await joinTeam(code, m); go('home'); toast(`Welkom bij ${S.team.name}`); });
      });
      return true;
    }
    case 'chooseteam': {
      const t = S.teams[+el.dataset.i];
      (hasLocalData() ? confirmSheet('Gegevens op deze telefoon vervangen?', 'Ze worden vervangen door die van het team.', 'Vervang', true) : Promise.resolve(true)).then(ok => {
        if (ok) run(async () => { await chooseTeam(t); go('home'); });
      });
      return true;
    }
    case 'logout': logout(); return true;
    case 'syncnow':
      if (!navigator.onLine) { toast('Geen internet: wijzigingen worden later verstuurd.'); return true; }
      run(async () => { await syncNow(); toast(syncErr ? 'Synchroniseren mislukt: ' + syncErr.message : 'Bijgewerkt', null, null, syncErr ? 'err' : ''); safeRender(); });
      return true;
    case 'openteam': ui.invite = null; go('team'); loadMembers(); return true;
    case 'makeinvite': run(async () => { ui.invite = await rpc('create_invite', { p_team: S.team.id }); saveUi(); render(); }); return true;
    case 'shareinvite': {
      const text = `Doe mee met ${S.team.name} in Eggselent! Open ${location.origin + location.pathname} op je iPhone in Safari, zet de app op je beginscherm, log in en vul deze code in: ${ui.invite}`;
      if (navigator.share) navigator.share({ text }).catch(() => {});
      else if (navigator.clipboard) { navigator.clipboard.writeText(text); toast('Tekst gekopieerd'); }
      return true;
    }
    case 'removemember': {
      const m = (ui.members || []).find(x => x.user_id === el.dataset.id);
      confirmSheet(`${(m && m.name) || 'Dit lid'} verwijderen?`, 'Diegene kan daarna niet meer bij de gegevens van het team.', 'Verwijder', true).then(ok => {
        if (ok) run(async () => { await api(`/rest/v1/team_members?team_id=eq.${S.team.id}&user_id=eq.${el.dataset.id}`, { method: 'DELETE' }); await loadMembers(); });
      });
      return true;
    }
    case 'leaveteam':
      confirmSheet('Team verlaten?', 'De gegevens van het team verdwijnen van deze telefoon.', 'Verlaat team', true).then(ok => {
        if (ok) run(async () => { await api(`/rest/v1/team_members?team_id=eq.${S.team.id}&user_id=eq.${S.userId}`, { method: 'DELETE' }); S.teams = await rpc('my_teams'); wipeLocal(); go('onboard'); });
      });

function render(){

    if (!S.session || S.session.expired) ui.view = 'login';

    else if (ui.view === 'login' || ui.view === 'onboard') ui.view = 'home';
  } else if (['login', 'onboard', 'team'].includes(ui.view)) ui.view = 'home';
  renderDeferred = false;

function go(view, extra){
  const from = ui.view;
  Object.assign(ui, { view }, extra || {});
  saveUi();
  let dir = (extra && extra._dir) || null;
  if (!dir && from !== view) dir = (DEPTH[view] || 0) > (DEPTH[from] || 0) ? 'push' : (DEPTH[view] || 0) < (DEPTH[from] || 0) ? 'pop' : null;
  delete ui._dir;
  const swap = () => { render(); window.scrollTo(0, 0); const t = app.querySelector('h1[tabindex]'); if (t) t.focus({ preventScroll: true }); };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (dir && document.startViewTransition && !reduce) {
    document.documentElement.classList.add(dir);
    const tr = document.startViewTransition(swap);
    tr.finished.finally(() => document.documentElement.classList.remove('push', 'pop'));
  } else swap();
}

const curVisit = () => db.visits.find(x => x.addressId === ui.id && x.date === ui.date);
function setVisit(patch, id, quiet){
  id = id || ui.id;
  const D = ui.date, a = byId(id);
  const ag = lastDecisive(visitsOf(a.id), D);
  let v = db.visits.find(x => x.addressId === id && x.date === D);
  if (!v) { v = { id: `${a.id}_${D}`, addressId: a.id, date: D, status: 'sold', eggs: 0, nextDate: null, nextEggs: null, nextManual: false, note: '' }; db.visits.push(v); }
  Object.assign(v, patch, { ts: Date.now() });
  if (v.status !== 'sold') v.double = false;
  // onthouden dat "voor 2 weken" is aangeboden: zo leert de app hoe vaak klanten daarop ingaan
  v.offered = DEC(v) && !!nextVisitImpact(a, D);
  if (v.status === 'nothome') { v.eggs = 0; v.nextDate = null; v.nextEggs = null; v.nextManual = false; }
  else {
    if (!v.nextDate) v.nextDate = defaultNext(a, D, weeksOf(ag) || 1);
    if (!v.nextManual) v.nextEggs = v.eggs > 0 ? v.eggs : agEggs(ag);
    if (v.nextEggs == null) v.nextEggs = 0;
  }
  save(quiet);
  if (!quiet) render();
  return v;
}
function snapshotVisit(id){ const v = db.visits.find(x => x.addressId === id && x.date === ui.date); return v ? { ...v } : null; }
function restoreVisit(id, snap){
  db.visits = db.visits.filter(x => !(x.addressId === id && x.date === ui.date));
  if (snap) db.visits.push(snap);
  save();
}
function visitSummary(v){
  if (v.status === 'nothome') return 'niet thuis';
  return `${v.status === 'none' ? 'geen eieren' : v.eggs + ' eieren'} · volgende keer ${fmtShort(v.nextDate)}`;
}
// noteren en door naar het volgende huis, met "ongedaan maken"
function recordAndNext(patch){
  const id = ui.id, a = byId(id), snap = snapshotVisit(id);
  const v = setVisit(patch, id, true);
  const target = nextTarget(1);
  const msg = `${label(a)}: ${visitSummary(v)}`;
  if (target) go('house', { id: target, _dir: 'push' });
  else go('home', { _dir: 'pop' });
  toast(target ? msg : `${msg}. Einde van de route.`, 'Ongedaan', () => { restoreVisit(id, snap); go('house', { id, _dir: 'pop' }); });
}
function recordFromList(id, patch){
  const a = byId(id), snap = snapshotVisit(id);
  const v = setVisit(patch, id);
  toast(`${label(a)}: ${visitSummary(v)}`, 'Ongedaan', () => { restoreVisit(id, snap); render(); });
}
function nextTarget(dir){
  const p = plan(ui.date), a = byId(ui.id), i = db.addresses.indexOf(a);
  const t = dir > 0 ? p.shown.find(x => x.i > i) : [...p.shown].reverse().find(x => x.i < i);
  return t ? t.a.id : null;
}
function step(dir){
  const t = nextTarget(dir);
  if (t) go('house', { id: t, _dir: dir > 0 ? 'push' : 'pop' });
  else if (dir > 0) { const p = plan(ui.date); go('home'); toast(p.shown.every(x => x.today) ? 'Einde van de route. Alles gedaan!' : 'Einde van de route. Er staan nog open adressen.'); }
  else toast('Dit is het eerste adres.');
}
function moveTo(a, pos){
  const from = db.addresses.indexOf(a);
  pos = Math.max(1, Math.min(db.addresses.length, pos | 0)) - 1;
  if (from < 0 || from === pos) return;
  db.addresses.splice(from, 1); db.addresses.splice(pos, 0, a);
}
const toggleIn = (arr, x) => arr.includes(x) ? arr.filter(y => y !== x) : [...arr, x];
const agreedFor = id => { const ag = lastDecisive(visitsOf(id), ui.date); return ag ? agEggs(ag) : 0; };

async function houseMenu(){
  const a = byId(ui.id), v = curVisit();

  else if (r === 'exclude') { a.excluded = true; save(); render(); toast(`${label(a)} uitgesloten`, 'Ongedaan', () => { a.excluded = false; save(); render(); }); }
