<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<script>
// Oude meldingslinks van Egg-sellent (?v=order …) wezen naar de root; die horen nu bij eggs/.
// Inloglinks (#access_token=…) handelt de hub zelf af: inloggen gebeurt hier voor alle apps.
(function () {
  var q = location.search;
  if (/[?&]v=/.test(q)) location.replace('eggs/' + q);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="shared/nozoom.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thuis">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Thuis</title>
<script>try { var t = localStorage.getItem('eggselent-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/ui.css">
<style>
.hub-top{padding-top:calc(env(safe-area-inset-top) + 20px)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media (max-width:360px){ .tiles{grid-template-columns:1fr} }
.tile{display:flex;flex-direction:column;gap:6px;min-height:150px;padding:14px;border-radius:16px;background:var(--cell);color:var(--label);text-decoration:none;position:relative}
.tile:active{background:var(--press)}
.tile .ic{font-size:2rem;line-height:1}
.tile .nm{font-weight:700;font-size:1.06rem;margin-top:auto}
.tile .ln{font-size:.88rem;line-height:1.3}
.tile .sb{font-size:.76rem;color:var(--label2);line-height:1.3}
.tile.now::after{content:"";position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;background:var(--tint)}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<div id="toast" aria-live="polite"></div>
<script type="module" src="hub/app.js"></script>
</body>
</html>
