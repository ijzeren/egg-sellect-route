<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<script>
// Oude koppelingen van Egg-sellent (meldingen met ?v=…, inloglinks met #access_token=…) wezen naar de root.
// Die horen nu bij eggs/: direct doorsturen, vóór er iets anders laadt.
(function () {
  var q = location.search, h = location.hash;
  if (/[?&]v=/.test(q) || /(access_token|error_description)=/.test(h)) location.replace('eggs/' + q + h);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Familie">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Familie</title>
<script>try { var t = localStorage.getItem('eggselent-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/ui.css">
<style>
.hub-top{padding-top:calc(env(safe-area-inset-top) + 20px)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media (max-width:360px){ .tiles{grid-template-columns:1fr} }
.tile{display:flex;flex-direction:column;gap:6px;min-height:150px;padding:14px;border-radius:16px;background:var(--cell);color:var(--label);text-decoration:none;position:relative}
.tile:active{background:var(--press)}
.tile .ic{font-size:2rem;line-height:1}
.tile .nm{font-weight:700;font-size:1.06rem;margin-top:auto}
.tile .ln{font-size:.88rem;line-height:1.3}
.tile .sb{font-size:.76rem;color:var(--label2);line-height:1.3}
.tile.now::after{content:"";position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;background:var(--tint)}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script type="module">
import { storage, account, applyTheme, esc, registerSW, CLOUD } from './shared/family.js';
import { APPS } from './shared/apps.js';
import { ymd } from './training/program.js';

applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
registerSW('./');

const DAYS = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
const MONL = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];

function render() {
  const now = new Date(), today = ymd(now), me = account(), hr = now.getHours();
  const hello = hr < 6 ? 'Goedenacht' : hr < 12 ? 'Goedemorgen' : hr < 18 ? 'Goedemiddag' : 'Goedenavond';
  let h = `<main class="hub-top"><div class="lt" style="padding-left:4px"><h1 tabindex="-1">${hello}</h1><div class="sub">${DAYS[now.getDay()]} ${now.getDate()} ${MONL[now.getMonth()]}</div></div><div class="tiles">`;
  for (const app of APPS) {
    let s = { line: '', sub: '' };
    try { s = app.status({ today, account: me, storage }) || s; } catch (e) { console.warn(app.id, e); }
    h += `<a class="tile${s.today ? ' now' : ''}" href="${app.route}"><span class="ic" aria-hidden="true">${app.icon}</span><span class="nm">${esc(app.name)}</span><span class="ln">${esc(s.line)}</span>${s.sub ? `<span class="sb">${esc(s.sub)}</span>` : ''}</a>`;
  }
  h += '</div>';
  if (CLOUD) {
    h += `<section class="sec"><h2 class="sec-h">Account</h2><div class="grp">${me
      ? `<div class="cell"><span class="tx"><span class="tt">${esc(me.email)}</span>${me.teamName ? `<span class="st">Team ${esc(me.teamName)}</span>` : ''}</span></div>`
      : `<a class="cell" href="eggs/"><span class="tx"><span class="tt">Inloggen</span><span class="st">Gaat via Egg-sellent; daarna geldt het voor alle apps.</span></span></a>`}</div></section>`;
  }
  document.getElementById('app').innerHTML = h + '</main>';
}

render();
// Terug naar de hub (of de app weer geopend): status opnieuw berekenen.
addEventListener('pageshow', render);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });
</script>
</body>
</html>
