document.addEventListener('click', e => {
  if (swipeJustEnded) { swipeJustEnded = false; e.preventDefault(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (openSwipe && !el.closest('.sw-a')) { closeSwipe(); if (el.closest('.sw')) return; }
  const act = el.dataset.act, D = ui.date;
  switch (act) {
    case 'tab': go(el.dataset.v); break;
    case 'today': ui.date = todayStr(); ui.dateSetOn = todayStr(); saveUi(); render(); break;
    case 'day': ui.date = addDays(ui.date, +el.dataset.n); ui.dateSetOn = todayStr(); saveUi(); render(); break;
    case 'ow': ui.ow = addDays(ui.ow, 7 * +el.dataset.n); saveUi(); render(); break;
    case 'togglehidden': ui.showHidden = !ui.showHidden; saveUi(); render(); break;
    case 'togglerows': ui.showRows = !ui.showRows; saveUi(); render(); break;
    case 'togglehist': ui.showHist = !ui.showHist; saveUi(); render(); break;
    case 'togglecalc': ui.showCalc = !ui.showCalc; saveUi(); render(); break;
    case 'open': ui.sheet = null; go('house', { id: el.dataset.id }); break;
    case 'prev': step(-1); break;
    case 'next': step(1); break;
    case 'samenext': { const n = agreedFor(ui.id); if (n) recordAndNext({ status: 'sold', eggs: n }); break; }
    case 'nhnext': recordAndNext({ status: 'nothome' }); break;
    case 'doublenext': {
      const a = byId(ui.id), imp = nextVisitImpact(a, D); if (!imp) break;
      recordAndNext({ status: 'sold', eggs: 2 * imp.agreed, double: true, nextDate: defaultNext(a, D, imp.k * 2), nextEggs: imp.agreed, nextManual: true });
      break;
    }
    case 'swsame': { const n = agreedFor(el.dataset.id); closeSwipe(true); if (n) recordFromList(el.dataset.id, { status: 'sold', eggs: n }); break; }
    case 'swnh': closeSwipe(true); recordFromList(el.dataset.id, { status: 'nothome' }); break;
    case 'swnone': closeSwipe(true); recordFromList(el.dataset.id, { status: 'none', eggs: 0 }); break;
    case 'housemenu': houseMenu(); break;
    case 'eggs': { const n = +el.dataset.n; setVisit(n ? { status: 'sold', eggs: n } : { status: 'none', eggs: 0 }); break; }
    case 'plus': { const v = curVisit(); const base = v && v.status !== 'nothome' ? v.eggs : agreedFor(ui.id); setVisit({ status: 'sold', eggs: base + 1 }); break; }
    case 'minus': { const v = curVisit(); const base = v && v.status !== 'nothome' ? v.eggs : agreedFor(ui.id); const n = Math.max(0, base - 1); setVisit(n ? { status: 'sold', eggs: n } : { status: 'none', eggs: 0 }); break; }
    case 'negg': setVisit({ nextEggs: +el.dataset.n, nextManual: true }); break;
    case 'nplus': { const v = curVisit(); if (v) setVisit({ nextEggs: (v.nextEggs || 0) + 1, nextManual: true }); break; }
    case 'nminus': { const v = curVisit(); if (v) setVisit({ nextEggs: Math.max(0, (v.nextEggs || 0) - 1), nextManual: true }); break; }
    case 'nweek': setVisit({ nextDate: defaultNext(byId(ui.id), D, +el.dataset.n) }); break;
    case 'nday': setVisit({ nextDate: el.dataset.date }); break;
    case 'opensheet': openSheet(el.dataset.s); break;
    case 'closesheet': closeSheet(); break;
    case 'altday': {
      const a = byId(ui.id), imp = nextVisitImpact(a, D); if (!imp) break;
      const v = curVisit(), keep = v && DEC(v) && !v.double;
      setVisit({ status: keep ? v.status : 'sold', eggs: keep ? v.eggs : imp.agreed, double: false, nextDate: el.dataset.date });
      toast(`Volgende keer ${fmtShort(el.dataset.date)}`);
      break;
    }
    case 'absent': {
      const d = el.dataset.date;
      db.absences = toggleIn(db.absences, d).sort(); save(); render();
      toast(isAbsent(d) ? `${fmtShort(d)}: geen ronde` : `${fmtShort(d)}: wel ronde`);
      break;
    }
    case 'round': db.settings.orderRound = +el.dataset.n; save(); render(); break;
    case 'edit': go('edit', { id: el.dataset.id, from: ui.view }); break;
    case 'editback': ui.draft = null; if (ui.from === 'house' && byId(ui.id)) go('house'); else go('route'); break;
    case 'routeedit': ui.routeEdit = !ui.routeEdit; saveUi(); render(); break;
    case 'toggleexcl': { const a = byId(ui.id); a.excluded = !a.excluded; save(); render(); break; }
    case 'prefday': {
      const d = +el.dataset.d;
      if (!ui.id) { ui.draft.prefDays = toggleIn(ui.draft.prefDays || [], d); saveUi(); render(); break; }
      const a = byId(ui.id); a.prefDays = toggleIn(a.prefDays || [], d); save(); render();
      break;
    }
    case 'bulkpref': ui.bulkPrefs = toggleIn(ui.bulkPrefs || [], +el.dataset.d); saveUi(); render(); break;
    case 'new': go('edit', { id: null, draft: null, from: 'route' }); break;
    case 'addone': {
      const d = ui.draft;
      if (!d || !d.street.trim()) { toast('Vul in elk geval de straat in.', null, null, 'err'); break; }
      const a = { id: uid(), street: d.street.trim(), number: d.number.trim(), name: d.name.trim(), note: d.note.trim(), prefDays: d.prefDays || [], excluded: false };
      const pos = Math.max(1, Math.min(db.addresses.length + 1, d.pos || db.addresses.length + 1));
      db.addresses.splice(pos - 1, 0, a); save();
      ui.draft = { street: a.street, number: '', name: '', note: '', prefDays: a.prefDays.slice(), pos: pos + 1 };
      saveUi(); render(); toast(`${label(a)} toegevoegd op plek ${pos}`);
      const n = app.querySelector('[data-field=number]'); if (n) n.focus();
      break;
    }
    case 'delete': {
      const a = byId(ui.id);
      confirmSheet(`${label(a)} verwijderen?`, 'Ook alle geschiedenis van dit adres verdwijnt. Dit kan niet ongedaan worden gemaakt.', 'Verwijder adres', true).then(ok => {
        if (!ok) return;
        db.addresses.splice(db.addresses.indexOf(a), 1);
        db.visits = db.visits.filter(v => v.addressId !== a.id);
        save(); go('route');
      });
      break;
    }
    case 'up': case 'down': {
      const a = byId(el.dataset.id), i = db.addresses.indexOf(a);
      moveTo(a, i + 1 + (act === 'up' ? -1 : 1)); save(true); render();
      break;
    }
    case 'bulk': go('bulk'); break;
    case 'bulkadd': {
      const list = bulkParse((document.getElementById('bulktext') || {}).value || ui.bulkText || '');
      if (!list.length) { toast('Geen adressen gevonden.', null, null, 'err'); break; }
      const prefs = (ui.bulkPrefs || []).slice();
      for (const x of list) db.addresses.push({ id: uid(), street: x.street, number: x.number, name: '', note: '', prefDays: prefs.slice(), excluded: false });
      const added = list.length;
      save(); ui.bulkText = ''; go('route');
      toast(`${plural(added, 'adres', 'adressen')} toegevoegd`, 'Ongedaan', () => { db.addresses.splice(db.addresses.length - added, added); save(); render(); });
      break;
    }
    case 'walkday': { db.settings.walkDays = toggleIn(db.settings.walkDays, +el.dataset.d).sort(byMon); save(); render(); break; }
    case 'export': exportBackup(); break;
    case 'import': document.getElementById('importfile').click(); break;
    case 'csv': exportCsv(); break;
    case 'doupdate': applyUpdate(); break;
    default: authAction(act, el);
  }
});

let openSwipe = null, swipeJustEnded = false, drag = null;
function closeSwipe(instant){
  if (!openSwipe) return;
  const fg = openSwipe.querySelector('.sw-fg');
  if (fg) { if (instant) fg.classList.add('drag'); fg.style.transform = ''; if (instant) requestAnimationFrame(() => fg.classList.remove('drag')); }
  openSwipe = null;
}
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const sw = e.target.closest('.sw[data-id]');
  const house = !sw && ui.view === 'house' && !ui.sheet && e.target.closest('.house-main') && !e.target.closest('input,textarea,.stepper,.chips,.segc');
  if (!sw && !house) return;
  if (house && (e.clientX < 24 || e.clientX > innerWidth - 24)) return;
  drag = { sw, house, x: e.clientX, y: e.clientY, dx: 0, active: false, base: 0 };
  if (sw) { const fg = sw.querySelector('.sw-fg'); const m = /translateX\((-?\d+)/.exec(fg.style.transform || ''); drag.base = m ? +m[1] : 0; drag.fg = fg; }
}, { passive: true });
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.active) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    if (Math.abs(dx) < 10) return;
    drag.active = true;
    if (drag.sw) { if (openSwipe && openSwipe !== drag.sw) closeSwipe(); drag.fg.classList.add('drag'); }
  }
  drag.dx = dx;
  if (drag.sw) {
    let x = drag.base + dx;
    const canL = !!drag.sw.dataset.same;
    if (!canL) x = Math.min(0, x);
    x = Math.max(-200, Math.min(canL ? 220 : 0, x));
    drag.fg.style.transform = `translateX(${x}px)`;
  } else if (drag.house) {
    const m = app.querySelector('.house-main'); if (m) { m.style.transform = `translateX(${dx * .35}px)`; m.style.opacity = String(1 - Math.min(.4, Math.abs(dx) / 600)); }
  }
}, { passive: true });
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.active) return;
  swipeJustEnded = true; setTimeout(() => { swipeJustEnded = false; }, 60);
  if (d.sw) {
    d.fg.classList.remove('drag');
    const x = d.base + d.dx, id = d.sw.dataset.id;
    if (x > 150 && d.sw.dataset.same) { d.fg.style.transform = ''; openSwipe = null; const n = agreedFor(id); if (n) recordFromList(id, { status: 'sold', eggs: n }); return; }
    if (x > 60 && d.sw.dataset.same) { d.fg.style.transform = 'translateX(88px)'; openSwipe = d.sw; return; }
    if (x < -60) { d.fg.style.transform = 'translateX(-176px)'; openSwipe = d.sw; return; }
    d.fg.style.transform = ''; if (openSwipe === d.sw) openSwipe = null;
  } else if (d.house) {
    const m = app.querySelector('.house-main'); if (m) { m.style.transform = ''; m.style.opacity = ''; }
    if (Math.abs(d.dx) > 70) step(d.dx < 0 ? 1 : -1);
  }
});
document.addEventListener('pointercancel', () => {
  if (drag && drag.fg) { drag.fg.classList.remove('drag'); drag.fg.style.transform = ''; }
  const m = app.querySelector('.house-main'); if (m) { m.style.transform = ''; m.style.opacity = ''; }
  drag = null;
});

let noteTimer = null;
function onField(e){
  const el = e.target, f = el.dataset && el.dataset.field;
  if (!f) return;
  if (f === 'vnote') {
    clearTimeout(noteTimer);
    const val = el.value;
    noteTimer = setTimeout(() => { const v = curVisit(); if (v) { v.note = val; save(true); } }, e.type === 'change' ? 0 : 500);
    return;
  }
  if (f === 'nextDate') { if (e.type === 'change' && el.value) setVisit({ nextDate: el.value }); return; }
  if (f === 'absenceScript') {
    if (e.type !== 'change') return;
    db.settings.absenceScript = el.value.trim() === DEFAULT_SCRIPT ? '' : el.value.trim(); save(); return;
  }
  if (f === 'order') {
    if (e.type !== 'change') return;
    if (el.value === '') delete db.orders[ui.ow]; else db.orders[ui.ow] = Math.max(0, Math.round(+el.value));
    save(); render(); return;
  }
  if (ui.view === 'edit') {
    const isNew = !ui.id, a = isNew ? ui.draft : byId(ui.id);
    if (!a) return;
    const val = el.value;
    if (f === 'pos') {
      if (e.type !== 'change') return;
      if (isNew) { a.pos = +val; saveUi(); return; }
      moveTo(a, +val); save(); render(); return;
    }
    a[f] = val;
    if (isNew) { saveUi(); return; }
    if (e.type === 'change') { a[f] = a[f].trim(); save(); }
  }
}
document.addEventListener('input', e => {
  if (e.target.id === 'bulktext') {
    ui.bulkText = e.target.value; saveUi();
    const c = document.getElementById('bulkcount'); if (c) c.textContent = plural(bulkParse(e.target.value).length, 'adres', 'adressen') + ' gevonden';
    return;
  }
  onField(e);
});
document.addEventListener('change', onField);

/* ---------- backup ---------- */
async function shareOrDownload(name, text, type){
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}
async function exportBackup(){
  const now = new Date();
  const data = JSON.stringify({ app: 'eggselent', exportedAt: `${ymd(now)}T${pad(now.getHours())}:${pad(now.getMinutes())}`, ...db, settings: { ...db.settings, lastBackup: ymd(now) } });
  if (await shareOrDownload(`eggselent-backup-${ymd(now)}.json`, data, 'application/json')) {
    db.settings.lastBackup = ymd(now); save(); render(); toast('Backup gemaakt');
  }
}
async function exportCsv(){
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const lines = ['datum;straat;nummer;naam;resultaat;eieren;volgende_keer;volgende_aantal;opmerking'];
  const vs = db.visits.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  for (const v of vs) {
    const a = byId(v.addressId) || {};
    lines.push([v.date, q(a.street), q(a.number), q(a.name), v.status === 'nothome' ? 'niet thuis' : v.status === 'none' ? 'geen' : 'verkocht', v.eggs || 0, v.nextDate || '', v.nextEggs ?? '', q(v.note)].join(';'));
  }
  await shareOrDownload(`eggselent-bezoeken-${todayStr()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}
document.getElementById('importfile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.addresses) || !Array.isArray(d.visits)) throw new Error('Dit is geen Eggselent-backup.');
    const ok = await confirmSheet(`Backup van ${d.exportedAt || 'onbekende datum'} terugzetten?`, `${plural(d.addresses.length, 'adres', 'adressen')}, ${plural(d.visits.length, 'bezoek', 'bezoeken')}. Dit vervangt alle huidige gegevens ${syncOn() ? 'van het hele team' : 'op deze telefoon'}.`, 'Zet terug', true);
    if (!ok) return;
    delete d.app; delete d.exportedAt;
    db = migrate(d); if (CLOUD) rekeyVisits(); save(); go('home'); toast('Backup teruggezet');
  } catch (err) { toast('Terugzetten mislukt: ' + err.message, null, null, 'err'); }
});

/* ---------- meldingen ---------- */
let toastTimer = null;
function toast(msg, actLabel, fn, kind){
  const t = document.getElementById('toast');
  t.innerHTML = `<div class="t ${kind || ''}" role="status"><span>${esc(msg)}</span>${actLabel ? `<button>${esc(actLabel)}</button>` : ''}</div>`;
  if (actLabel) t.querySelector('button').onclick = () => { t.innerHTML = ''; fn(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.innerHTML = ''; }, actLabel ? 5000 : 2600);
}
function flashSaved(){} // automatisch opslaan is op iOS vanzelfsprekend; geen aparte melding

/* ---------- updates: stil bijwerken zodra de app naar de achtergrond gaat ---------- */
let swReg = null, wantReload = false, updateReady = false;
function showUpdate(){ updateReady = true; if (['settings', 'home', 'order', 'route'].includes(ui.view) && !document.activeElement.matches('input,textarea')) safeRender(); }
function applyUpdate(){
  wantReload = true;
  if (swReg && swReg.waiting) swReg.waiting.postMessage('skipWaiting'); else location.reload();
}
async function checkUpdate(){ if (swReg) { try { await swReg.update(); } catch (e) {} } }
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    swReg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate();
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(); });
    });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (wantReload) { wantReload = false; location.reload(); } });
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (updateReady && swReg && swReg.waiting) { wantReload = true; swReg.waiting.postMessage('skipWaiting'); } return; }
  const before = ui.date; fixDate(); if (ui.date !== before) { saveUi(); render(); }
  checkUpdate();
  syncNow();
});

ui.sheet = null;
render();
if (CLOUD) loginFromLink().then(ok => { if (ok) { ui.loginSent = false; saveUi(); render(); syncNow(); } }).catch(e => toast(e.message, null, null, 'err'));
syncNow();
</script>
