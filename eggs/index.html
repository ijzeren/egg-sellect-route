<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Familie">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="stylesheet" href="../shared/theme.css">
<title>Egg-sellent</title>
<script>try { var t = localStorage.getItem('eggselent-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
/* navigatiebalk */
.nav{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--sep)}
.nav-t{font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.nav-l,.nav-r{display:flex;align-items:center;gap:4px}
.nav-r{justify-content:flex-end}
.nb{display:inline-flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 8px;color:var(--tint);font-size:1rem;justify-content:center}
a.nb{text-decoration:none}
.nb.back{padding-left:0}
.nb.back .i{width:1.6rem;height:1.6rem;stroke-width:2.3}
.nb:active{opacity:.35}
.nb.bold{font-weight:600}
.lt{padding:4px 20px 8px}
.lt h1{font-size:2rem;font-weight:700;letter-spacing:.01em;line-height:1.2}
.lt .sub{color:var(--label2);font-size:.882rem;margin-top:2px}
main{padding:0 16px calc(env(safe-area-inset-bottom) + 110px);max-width:680px;margin:0 auto}

/* secties en lijsten (zoals Instellingen) */
.sec{margin-top:24px}
.sec:first-child{margin-top:8px}
.sec-h{font-size:.765rem;text-transform:uppercase;color:var(--label2);padding:0 16px 7px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:flex-end}
.sec-h.tog{text-transform:none;font-size:1.176rem;font-weight:700;color:var(--label);padding:0 4px 8px;width:100%;text-align:left;letter-spacing:0;align-items:center;justify-content:flex-start;gap:6px}
.sec-h.tog .i{color:var(--tint);transition:transform .2s}
.sec-h.tog.open .i{transform:rotate(90deg)}
.sec-f{font-size:.765rem;color:var(--label2);padding:7px 16px 0;line-height:1.38}
.grp{background:var(--cell);border-radius:12px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:11px 16px;text-align:left;background:var(--cell);color:var(--label)}
.cell:not(:last-child)::after{content:"";position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep)}
.cell.ind:not(:last-child)::after{left:52px}
button.cell:active,a.cell:active{background:var(--press)}
a.cell{text-decoration:none}
.cell .tx{flex:1;min-width:0}
.cell .tt{display:block;font-size:1rem}
.cell .st{display:block;font-size:.882rem;color:var(--label2);margin-top:2px}
.cell .st.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .tr{color:var(--label2);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.cell .chev{color:var(--label3);width:.9rem;height:.9rem;stroke-width:2.4}
.cell.red{color:var(--red)} .cell.tint{color:var(--tint)} .cell.center{justify-content:center}
.cell.dim{opacity:.5}
.cell.cur{background:linear-gradient(var(--orange-s),var(--orange-s)),var(--cell)}
.house-main{touch-action:pan-y;transition:transform .2s,opacity .2s}
.cell .no{width:1.6rem;color:var(--label2);font-size:.882rem;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.cell.field{padding-top:6px;padding-bottom:6px}
.cell.field .fl{width:7.2rem;flex:none}
.cell.field input,.cell.field select{flex:1;min-width:0;border:0;background:none;padding:8px 0;font-size:1rem;text-align:right;-webkit-appearance:none;appearance:none}
.cell.field input:focus{outline:none}
.cell textarea,.ta{width:100%;border:0;background:none;resize:vertical;min-height:4.5rem;font-size:1rem;padding:0;line-height:1.35}
.cell.stack{flex-direction:column;align-items:stretch;gap:10px}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--red);flex:none}
.dot.none{background:transparent}
.ico{width:1.75rem;height:1.75rem;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ico .i{width:1.1rem;height:1.1rem;stroke-width:2.1}

/* knoppen */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;padding:0 16px;font-weight:600;font-size:1rem;background:var(--tint);color:var(--on-tint);transition:transform .08s,opacity .1s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.gray{background:var(--fill);color:var(--tint)}
.btn.gray.red{color:var(--red)}
.btn.big{min-height:56px;font-size:1.06rem;border-radius:14px}
.btn:disabled{opacity:.4}
.btn .i{width:1.25rem;height:1.25rem;stroke-width:2.2}
.link{color:var(--tint);font-weight:500;min-height:44px;display:inline-flex;align-items:center}
.link:active{opacity:.4}

/* chips en segmentknop */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;min-width:48px;padding:0 14px;border-radius:22px;background:var(--fill);font-weight:600;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--tint);color:var(--on-tint)}
.chip:active{opacity:.6}
.chip.abs{background:var(--red-s);color:var(--red);text-decoration:line-through;opacity:.9}
.chips.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.chips.grid7 .chip{min-width:0;padding:0}
.chips.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chips.grid6 .chip{min-width:0;padding:0}
.wafel-h{display:flex;gap:10px;align-items:flex-start}
.wafel-h .i{color:var(--orange);margin-top:1px}
.segc{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.segc button{flex:1;min-height:36px;border-radius:7px;font-size:.882rem;font-weight:500;white-space:nowrap;padding:0 4px}
.segc button[aria-pressed=true]{background:var(--cell);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
@media (prefers-color-scheme: dark){ :root:not([data-theme=light]) .segc button[aria-pressed=true]{background:#636366} }
:root[data-theme=dark] .segc button[aria-pressed=true]{background:#636366}
.toggle{position:relative;width:51px;height:31px;border-radius:16px;background:var(--fill2);flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.toggle[aria-checked=true]{background:#34C759}
.toggle[aria-checked=true]::after{transform:translateX(20px)}
.toggle:disabled{opacity:.5}

/* stepper */
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper button{width:56px;height:56px;border-radius:50%;background:var(--fill);color:var(--tint);display:flex;align-items:center;justify-content:center}
.stepper button:active{opacity:.5}
.stepper button .i{width:1.5rem;height:1.5rem;stroke-width:2.4}
.stepper .val{flex:1;text-align:center}
.stepper .val b{display:block;font:700 2.4rem/1 ui-rounded,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.stepper .val span{font-size:.765rem;color:var(--label2)}

/* datum/weekbalk */
.pager{display:flex;align-items:center;gap:4px;padding:0 4px 12px}
.pager .mid{flex:1;text-align:center}
.pager .mid b{display:block;font-size:1rem;font-weight:600}
.pager .mid b::first-letter{text-transform:uppercase}
.pager .mid span{font-size:.765rem;color:var(--label2)}
.pager .nb{color:var(--tint)}

/* meldingen en badges */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;background:var(--cell);font-size:.882rem;line-height:1.38}
.banner .i{margin-top:1px}
.banner.red{background:var(--red-s)} .banner.red .i,.banner.red b{color:var(--red)}
.banner.blue{background:var(--blue-s)} .banner.blue .i{color:var(--blue)}
.badge{display:inline-block;font-size:.706rem;font-weight:600;border-radius:6px;padding:2px 7px;margin:3px 4px 0 0;vertical-align:middle}
.badge.red{background:var(--red-s);color:var(--red)} .badge.blue{background:var(--blue-s);color:var(--blue)} .badge.gray{background:var(--fill);color:var(--label2)} .badge.green{background:var(--green-s);color:var(--green)}
.progress{padding:4px 4px 14px}
.progress .t{font-size:.882rem;color:var(--label2);margin-bottom:8px}
.progress .t b{color:var(--label);font-weight:600}
.bar-bg{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar-fg{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.stat{color:var(--label2);font-variant-numeric:tabular-nums}
.stat.done{color:var(--green);font-weight:600}
.stat.nh{color:var(--red);font-weight:600}
.stat.zero{color:var(--label2);font-weight:600}

/* swipe-rijen (zoals Mail) */
.sw{position:relative;overflow:hidden}
.sw:not(:last-child)::after{content:"";position:absolute;left:52px;right:0;bottom:0;height:.5px;background:var(--sep);z-index:2}
.sw .cell::after{display:none}
.sw-fg{position:relative;z-index:1;touch-action:pan-y;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sw-fg.drag{transition:none}
.sw-a{position:absolute;top:0;bottom:0;display:flex}
.sw-a.l{left:0} .sw-a.r{right:0}
.sw-a button{width:88px;color:#fff;font-weight:600;font-size:.882rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.sw-a .ok{background:#34C759} .sw-a .nh{background:#FF3B30} .sw-a .no{background:#8E8E93}

/* huis */
.addr{padding:6px 4px 12px}
.addr h1{font-size:1.647rem;font-weight:700;line-height:1.15}
.addr .sub{color:var(--label2);font-size:.882rem;margin-top:3px}
.callout{display:flex;gap:10px;background:var(--note-s);border-radius:12px;padding:10px 14px;font-size:.941rem;margin-bottom:12px}
.callout .i{color:var(--yellow)}
.hero{padding:16px}
.hero .lbl{font-size:.765rem;font-weight:600;text-transform:uppercase;color:var(--label2);letter-spacing:.02em}
.hero .big{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.hero .big b{font:700 3.3rem/1 ui-rounded,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.hero .big span{font-size:1.176rem;font-weight:600;color:var(--label2)}
.hero .big.two b{font-size:2.5rem}
.hero .big b.red{color:var(--red)}
.hero .big.green b{color:var(--green)} .hero .big.red b{color:var(--red);font-size:2.2rem}
.hero .meta{font-size:.882rem;color:var(--label2);margin-top:6px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px 16px}
.mt{border-radius:10px;background:var(--cell2);padding:6px 2px;text-align:center;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.mt .d{font-size:.647rem;color:var(--label2)}
.mt .v{font:700 1.176rem/1.15 ui-rounded,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.mt.sold .v{color:var(--green)} .mt.nh .v{color:var(--red)} .mt.blank{opacity:.45}
.absc{border-radius:12px;background:var(--cell);padding:14px;border:1.5px solid var(--red)}
.absc .h{display:flex;gap:8px;align-items:flex-start;color:var(--red);font-weight:600;margin-bottom:10px}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-bottom:10px}
.wk div{border-radius:10px;padding:7px 4px;text-align:center;border:1.5px solid var(--green);color:var(--green)}
.wk div b{display:block;font-size:1.06rem}
.wk div span{font-size:.706rem;font-weight:600}
.wk div em{display:block;font-size:.588rem;font-style:normal;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
.wk div.x{background:var(--red);border-color:var(--red);color:#fff}
.wk div.x b{text-decoration:line-through}
.script{font-size:.941rem;font-style:italic;color:var(--label);background:var(--cell2);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:52px minmax(0,.9fr) minmax(0,1.7fr);gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);view-transition-name:dock}
.dock.two{grid-template-columns:52px 1fr}
.dock.one{grid-template-columns:1fr;gap:6px}
.dock .dh{margin:0;font-size:.8rem;color:var(--label2);text-align:center;min-height:2.3em;display:flex;align-items:center;justify-content:center;line-height:1.15}
.selm{width:1.45rem;height:1.45rem;border-radius:50%;border:1.5px solid var(--label3, #C7C7CC);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.cell.sel .selm{background:var(--tint);border-color:var(--tint)}
.selm .i{width:1rem;height:1rem;stroke-width:3}
.cell.sel{background:var(--selbg, rgba(0,122,255,.08))}
.dock .iconbtn{min-height:56px;border-radius:14px;background:var(--fill);color:var(--tint);display:flex;align-items:center;justify-content:center}
.dock .iconbtn:active{opacity:.5}
.dock .btn{min-height:56px;padding:0 10px;font-size:1rem;white-space:nowrap}
.dock .btn small{white-space:nowrap}
.dock .btn small{display:block;font-size:.706rem;font-weight:500;opacity:.85}
.dock .btn.stack{flex-direction:column;gap:0;line-height:1.15}

/* planning */
.hero.order .big b{color:var(--tint)}

/* tabbalk */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;padding:6px 4px calc(env(safe-area-inset-bottom) + 2px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);view-transition-name:tabbar}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:49px;font-size:.588rem;font-weight:500;color:var(--gray);position:relative}
.tabbar button .i{width:1.6rem;height:1.6rem}
.tabbar button[aria-current=page]{color:var(--tint)}
.tabbar button[aria-current=page] .i{stroke-width:2.3}
.tabbar .tb{position:absolute;top:2px;left:calc(50% + 6px);min-width:10px;height:10px;border-radius:5px;background:var(--red)}

/* paneel van onderen (sheet) + actieblad */
#sheet,#acts{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet.open,#acts.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .3s}
.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom);max-width:680px;margin:0 auto}
.open .sheet{transform:none}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;min-height:48px}
.sheet-h .nav-t{font-weight:600}
.sheet-c{overflow:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.acts{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);transform:translateY(120%);transition:transform .3s cubic-bezier(.2,.9,.25,1);max-width:560px;margin:0 auto}
.open .acts{transform:none}
.acts .g{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px}
.acts .msg{padding:14px 16px;text-align:center;font-size:.765rem;color:var(--label2);border-bottom:.5px solid var(--sep)}
.acts .msg b{display:block;font-size:.765rem;font-weight:600;margin-bottom:2px}
.acts button{display:block;width:100%;min-height:57px;font-size:1.176rem;color:var(--blue);border-bottom:.5px solid var(--sep)}
.acts button:last-child{border-bottom:0}
.acts button.red{color:var(--red)}
.acts button.bold{font-weight:600}
.acts button:active{background:var(--press)}

/* HUD-melding */
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:60;display:flex;justify-content:center;pointer-events:none}
#toast .t{display:flex;align-items:center;gap:14px;max-width:520px;padding:12px 16px;border-radius:14px;background:rgba(30,30,30,.92);color:#fff;font-size:.882rem;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);animation:hud .25s ease-out}
#toast .t.err{background:rgba(215,0,21,.95)}
#toast .t button{color:#FF9F0A;font-weight:600;min-height:44px;padding:0 4px;white-space:nowrap;pointer-events:auto}
@keyframes hud{from{opacity:0;transform:translateY(10px)}}

/* overig */
.brand{text-align:center;padding:calc(env(safe-area-inset-top) + 40px) 0 24px}
.brand img{width:88px;height:88px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.brand h1{font-size:1.647rem;font-weight:700;margin-top:14px}
.brand p{color:var(--label2);margin-top:4px}
.codebox{font:800 2.2rem/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;text-align:center;padding:18px 0 14px}
.daytog{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%}
.daytog .chip{padding:0;min-width:0}
table.h{width:100%;border-collapse:collapse;font-size:.882rem;font-variant-numeric:tabular-nums}
table.h th{text-align:right;color:var(--label2);font-weight:500;font-size:.765rem;padding:10px 16px 6px}
table.h td{text-align:right;padding:10px 16px;border-top:.5px solid var(--sep)}
table.h th:first-child,table.h td:first-child{text-align:left}
.empty{text-align:center;padding:40px 20px;color:var(--label2)}
.empty .i{width:3rem;height:3rem;color:var(--label3);stroke-width:1.5;margin-bottom:10px}
.empty h2{color:var(--label);font-size:1.294rem;font-weight:700;margin-bottom:6px}
.mb{margin-bottom:12px}
.mt12{margin-top:12px}

/* overgangen tussen schermen (zoals een navigatie-stack) */
::view-transition-old(root),::view-transition-new(root){animation-duration:.24s;animation-timing-function:cubic-bezier(.2,.85,.25,1)}
html.push::view-transition-old(root){animation-name:vt-out-l} html.push::view-transition-new(root){animation-name:vt-in-r}
html.pop::view-transition-old(root){animation-name:vt-out-r;z-index:2} html.pop::view-transition-new(root){animation-name:vt-in-l}
@keyframes vt-in-r{from{transform:translateX(100%)}} @keyframes vt-out-l{to{transform:translateX(-28%);opacity:.7}}
@keyframes vt-in-l{from{transform:translateX(-28%);opacity:.7}} @keyframes vt-out-r{to{transform:translateX(100%)}}
@media (prefers-reduced-motion: reduce){
  *,::view-transition-old(root),::view-transition-new(root){animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="acts"></div>
<div id="toast" aria-live="polite"></div>
<script src="../config.js"></script>
<input type="file" id="importfile" accept=".json,application/json" hidden>

<script>
'use strict';
const APP_VERSION = '3.9.0';
const KEY = 'eggselent-data-v1';
const UIKEY = 'eggselent-ui-v1';

/* ---------- datums (altijd lokale tijd, nooit toISOString) ---------- */
const DAYS = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const DSH  = ['zo','ma','di','wo','do','vr','za'];
const MON  = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MONL = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const WEEK = [1,2,3,4,5,6,0]; // maandag eerst
const pad = n => String(n).padStart(2,'0');

const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };

const monIdx = day => (day + 6) % 7;

function emptyDb(){ return migrate({}); }
function migrate(d){
  d.version = 2;
  d.settings = Object.assign({ walkDays: [], lastBackup: null, orderRound: 1, absenceScript: '', marginPct: 10, orderDow: 5, deliveryDow: 3, stroopWeeks: [], stroopLead: 2 }, d.settings || {});
  if (!Array.isArray(d.settings.stroopWeeks)) d.settings.stroopWeeks = [];
  d.addresses = Array.isArray(d.addresses) ? d.addresses : [];
  d.visits = Array.isArray(d.visits) ? d.visits : [];
  d.absences = Array.isArray(d.absences) ? d.absences : [];
  d.orders = (d.orders && typeof d.orders === 'object') ? d.orders : {};
  d.stock = Array.isArray(d.stock) ? d.stock : []; // leveringen en tellingen
  for (const a of d.addresses) {
    if (!Array.isArray(a.prefDays)) a.prefDays = (a.prefDay != null && a.prefDay !== '') ? [+a.prefDay] : [];
    delete a.prefDay;
    if (typeof a.email !== 'string') a.email = '';

    if (v.status !== 'nothome' && v.nextEggs == null) v.nextEggs = v.eggs || 0;

}

function hash(s){ let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36) + s.length.toString(36); }

const tsMs = s => s ? Date.parse(String(s).replace(/(\.\d{3})\d+/, '$1').replace(' ', 'T')) : 0;

function syncRecords(){
  const out = [];
  db.addresses.forEach((a, i) => out.push(['addresses', a.id, { id: a.id, street: a.street || '', number: a.number || '', name: a.name || '', email: a.email || '', freq: freqOf(a), note: a.note || '', pref_days: a.prefDays || [], sort: i, excluded: !!a.excluded }]));
  for (const v of db.visits) out.push(['visits', v.id, { id: v.id, address_id: v.addressId, date: v.date, status: v.status, eggs: v.eggs || 0, next_date: v.nextDate || null, next_eggs: v.nextEggs ?? null, next_manual: !!v.nextManual, note: v.note || '', double: !!v.double, offered: !!v.offered, wafels: v.wafels || 0, wafels_next: v.wafelsNext ?? null }]);
  for (const d of db.absences) out.push(['absences', d, { date: d }]);
  for (const [w, n] of Object.entries(db.orders)) out.push(['orders', w, { week_start: w, amount: n }]);
  for (const e of db.stock || []) out.push(['stock_events', e.id, { id: e.id, date: e.date, kind: e.kind, ordered: e.ordered ?? null, delivered: e.delivered ?? null, broken: e.broken || 0, counted: e.counted ?? null, box6: e.box6 ?? null, box10: e.box10 ?? null, note: e.note || '' }]);
  out.push(['settings', 'team', { walk_days: db.settings.walkDays, order_round: db.settings.orderRound || 1, absence_script: db.settings.absenceScript || '', margin_pct: db.settings.marginPct ?? 10, order_dow: db.settings.orderDow ?? 5, delivery_dow: db.settings.deliveryDow ?? 3, stroop_weeks: (db.settings.stroopWeeks || []).slice().sort(), stroop_lead: db.settings.stroopLead ?? 2 }]);
  return out;
}
function tombstone(t, k){
  if (t === 'visits') return { id: k, address_id: k.slice(0, -11), date: k.slice(-10), status: 'none' };
  if (t === 'absences') return { date: k };
  if (t === 'orders') return { week_start: k };
  return { id: k };
}
// queue=false: alleen de hashes bijwerken (na ophalen van de server)
// Velden die later zijn toegevoegd tellen alleen mee in de vergelijking als ze iets bevatten. Zo stuurt een
// telefoon na een update niet al zijn oude bezoeken opnieuw (met een nieuwe tijd), wat nieuwere gegevens van
// een andere telefoon zou kunnen overschrijven.
function hashRow(t, row){
  if (t === 'visits' && !row.wafels && row.wafels_next == null) { const { wafels, wafels_next, ...r } = row; return r; }
  if (t === 'settings' && !(row.stroop_weeks || []).length && row.stroop_lead === 2) { const { stroop_weeks, stroop_lead, ...r } = row; return r; }
  return row;
}
function syncDiff(queue){
  if (!CLOUD || !S.team) return;
  const now = new Date().toISOString(), seen = new Set();
  let n = 0;
  for (const [t, k, row] of syncRecords()) {
    const key = t + ':' + k, h = hash(JSON.stringify(hashRow(t, row)));
    seen.add(key);
    if (H[key] !== h) { H[key] = h; if (queue) { S.outbox[key] = { t, k, row, u: now }; n++; } }
  }
  for (const key of Object.keys(H)) if (!seen.has(key)) {
    const i = key.indexOf(':'), t = key.slice(0, i), k = key.slice(i + 1);
    delete H[key];
    if (queue && t !== 'settings') { S.outbox[key] = { t, k, row: tombstone(t, k), u: now, del: true }; n++; }
  }
  saveH();
  if (n) { saveS(); syncBadge(); scheduleSync(1500); }
}

async function api(path, opts){
  const { method = 'GET', body, headers = {}, auth = true } = opts || {};
  if (auth) await ensureToken();
  const go = () => fetch(CFG.supabaseUrl + path, {
    method,
    headers: Object.assign({ apikey: CFG.supabaseKey, 'Content-Type': 'application/json' }, auth && S.session ? { Authorization: 'Bearer ' + S.session.access_token } : {}, headers),
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let res = await go();
  if (res.status === 401 && auth && S.session) { await refreshToken(); res = await go(); }
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!res.ok) {
    const m = data && (data.msg || data.error_description || data.message || data.error);
    const err = new Error(m || 'Serverfout ' + res.status); err.status = res.status; throw err;
  }
  return data;
}
const rpc = (fn, args) => api('/rest/v1/rpc/' + fn, { method: 'POST', body: args || {} });

let refreshing = null;
async function ensureToken(){
  if (!S.session) throw Object.assign(new Error('Niet ingelogd'), { auth: true });
  if (S.session.expires_at * 1000 - 60000 < Date.now()) await refreshToken();
}
function refreshToken(){
  if (!refreshing) refreshing = (async () => {
    try {
      const res = await fetch(CFG.supabaseUrl + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: CFG.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: S.session.refresh_token }) });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (res.status >= 400 && res.status < 500) { S.session.expired = true; saveS(); render(); } // opnieuw inloggen; gegevens + wachtrij blijven bewaard
        throw Object.assign(new Error('Sessie verlopen, log opnieuw in'), { auth: true });
      }
      setSession(d);
    } finally { refreshing = null; }
  })();
  return refreshing;
}
function setSession(d){
  S.session = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600), email: d.user ? d.user.email : (S.session && S.session.email) };
  if (d.user) S.newUserId = d.user.id;
  saveS();
}

function applyTheme(t){
  const root = document.documentElement;
  if (t === 'light' || t === 'dark') root.dataset.theme = t; else delete root.dataset.theme;
  const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name=theme-color]').forEach(m => m.setAttribute('content', dark ? '#000000' : '#F2F2F7'));
}

const DEFAULT_PREFS = { walkday: '07:00', order: null, team: true };
async function pushSubscribe(){

  if (perm !== 'granted') throw new Error(perm === 'denied' ? 'Meldingen zijn geweigerd. Zet ze aan via Instellingen van de iPhone → Meldingen → Egg-sellent.' : 'Geen toestemming gegeven.');

// Samenvatting per loopdag en week, voor meldingen met getallen (alleen versturen als er iets veranderd is)
async function pushDigest(){
  if (!syncOn() || !S.team) return;
  const T = todayStr(), wd = db.settings.walkDays, rows = [];
  for (let i = 0; i < 14; i++) {
    const d = addDays(T, i); if (!wd.includes(dow(d))) continue;
    const open = plan(d).shown.filter(x => !x.today);
    rows.push({ key: 'day:' + d, payload: { open: open.length, eggs: sum(open, x => x.exp || 0), absent: isAbsent(d) } });
  }
  for (const k of [0, 1]) { const W = addDays(weekStart(T), 7 * k); rows.push({ key: 'week:' + W, payload: { week: isoWeek(W), advice: orderAdvice(W).adviceMain } }); }
  if (stockEvents().some(e => e.kind === 'delivery' && e.delivered != null)) { // met voorraad: advies per levering (vervangt het weekgetal)
    const sp = supplyPlan(), key = 'week:' + weekStart(sp.delivery), row = rows.find(r => r.key === key);
    const payload = { week: isoWeek(sp.delivery), advice: sp.advice, delivery: sp.delivery, stock: sp.stock };
    if (row) row.payload = payload; else rows.push({ key, payload });
  }
  const h = hash(JSON.stringify(rows));
  if (S.digestHash === h + S.team.id) return;
  const now = new Date().toISOString();
  await api('/rest/v1/team_digest?on_conflict=team_id,key', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: rows.map(r => ({ team_id: S.team.id, key: r.key, payload: r.payload, updated_at: now })) });
  S.digestHash = h + S.team.id; saveS();
}

function wipeLocal(){

// Bezoeken krijgen een vaste sleutel per huis per dag, zodat twee telefoons hetzelfde bezoek niet dubbel aanmaken.
function rekeyVisits(){
  const m = new Map();
  for (const v of db.visits) { const id = `${v.addressId}_${v.date}`, ex = m.get(id); v.id = id; if (!ex || (v.ts || 0) >= (ex.ts || 0)) m.set(id, v); }
  db.visits = [...m.values()];

function scheduleSync(ms){ clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms || 0); }
async function syncNow(){
  if (!syncOn() || syncing) return;
  if (!navigator.onLine) { syncBadge(); return; }
  syncing = true; syncBadge();
  try {
    await push(); await pull(); if (pendingCount()) await push();
    syncErr = null; S.lastSync = new Date().toISOString();
    pushDigest().catch(() => {});
    if (S.push && S.push.team !== S.team.id) pushPrefs({}).catch(() => {});
  } catch (e) { syncErr = e; console.warn('sync', e); }

async function push(){
  const entries = Object.values(S.outbox);
  if (!entries.length) return;
  const done = e => { const key = e.t + ':' + e.k; if (S.outbox[key] === e) delete S.outbox[key]; };
  const st = entries.find(e => e.t === 'settings');
  if (st) {
    if (isAdmin()) await api(`/rest/v1/teams?id=eq.${S.team.id}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: Object.assign({}, st.row, { settings_updated_at: st.u }) });
    done(st);
  }
  for (const t of TABLES) for (const del of [false, true]) {
    const list = entries.filter(e => e.t === t && !!e.del === del);
    for (let i = 0; i < list.length; i += 500) {
      const chunk = list.slice(i, i + 500);
      await api(`/rest/v1/${t}?on_conflict=${CONFLICT[t]}`, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: chunk.map(e => Object.assign({}, e.row, { team_id: S.team.id, updated_at: e.u, deleted: del })) });

async function pull(){

  try {
    S.teams = (await rpc('my_teams')) || [];
    const mine = S.teams.find(x => x.team_id === tid);
    if (mine) Object.assign(S.team, { name: mine.team_name, role: mine.role, memberName: mine.member_name, apps: mine.apps || {} });

    const left = next ? (stockAt(to) || { stock: 0 }).stock : null;

/* ---------- stroopwafels (niet elke week) ---------- */
const WAFEL_CHIPS = [0, 1, 2, 3, 4, 5];
const stroopWeeks = () => (db.settings.stroopWeeks || []).slice().sort();
const nextStroopAfter = D => stroopWeeks().find(w => w > weekStart(D)) || null;   // eerstvolgende stroopwafelweek ná de week van D
const stroopLabel = W => `week ${isoWeek(W)} (${weekLabel(W)})`;
// Voor een adres op dag D: is het stroopwafelweek (afgesproken pakjes), of moet het nu aangekondigd worden?
// Aankondigen in de weken ervoor: zoveel weken als ingesteld, of meer als het adres minder vaak eieren krijgt.
function wafelInfo(a, D){
  const ws = stroopWeeks(); if (!ws.length) return null;
  const W = weekStart(D);
  if (ws.includes(W)) {
    const ag = visitsOf(a.id).filter(v => v.date < W && v.wafelsNext != null && nextStroopAfter(v.date) === W).pop();
    return { mode: 'week', S: W, agreed: ag ? ag.wafelsNext : null };
  }
  const S = nextStroopAfter(D); if (!S) return null;
  const weeks = weeksBetween(W, S);
  if (weeks > Math.max(db.settings.stroopLead ?? 2, freqOf(a))) return null;
  return { mode: 'announce', S, weeks };
}
const wafelDraftOf = (id, D) => (ui.wafelDraft && ui.wafelDraft[`${id}_${D}`]) || {};
// Afgesproken pakjes voor stroopwafelweek S, per adres (laatste afspraak telt)
function wafelAgreed(S){
  const out = [];
  for (const a of db.addresses) {
    if (a.excluded) continue;
    const ag = visitsOf(a.id).filter(v => v.date < S && v.wafelsNext != null && nextStroopAfter(v.date) === S).pop();
    if (ag && ag.wafelsNext > 0) out.push({ a, n: ag.wafelsNext, date: ag.date });
  }

}
const wafelsSold = (from, to) => sum(db.visits.filter(v => v.date >= from && v.date <= to), v => v.wafels || 0);
// Voorraad pakjes: ontvangen − verkocht; een telling zet het op het getelde aantal
function wafelStock(asOf){
  const ev = stockEvents().filter(e => (e.kind === 'wafelin' || e.kind === 'wafelcount') && e.date <= asOf);
  if (!ev.length) return null;
  const start = ev.map(e => e.date).sort()[0];
  const dates = [...new Set([...ev.map(e => e.date), ...db.visits.filter(v => v.wafels && v.date >= start && v.date <= asOf).map(v => v.date)])].sort();
  let st = 0, inn = 0, sold = 0; const diffs = {};
  for (const d of dates) {
    for (const e of ev) if (e.date === d && e.kind === 'wafelin') { st += e.delivered || 0; inn += e.delivered || 0; }
    const s1 = wafelsSold(d, d); st -= s1; sold += s1;
    for (const e of ev) if (e.date === d && e.kind === 'wafelcount' && e.counted != null) { diffs[e.id] = { have: st, diff: e.counted - st }; st = e.counted; }
  }
  return { start, stock: st, inn, sold, diffs };
}
const isWafelEv = e => e.kind === 'wafelin' || e.kind === 'wafelcount';

/* ---------- doosjes van 6 en 10 ---------- */
const BOX_KINDS = ['boxes', 'boxreturn', 'boxcount'];
const isBoxEv = e => BOX_KINDS.includes(e.kind);
// Uitgegeven doosjes per dag (verkochte eieren, verdeeld in doosjes van 10 en 6). los = aantallen die niet in hele doosjes passen.
function boxesIssuedByDate(from, to){
  const m = new Map();
  for (const v of db.visits) {
    if (!DEC(v) || !v.eggs || v.date < from || v.date > to) continue;
    const x = m.get(v.date) || { s: 0, t: 0, los: 0 }, b = boxSplit(v.eggs);
    if (b) { x.s += b.s; x.t += b.t; } else x.los += v.eggs;
    m.set(v.date, x);
  }
  return m;
}
function boxesIssued(from, to){
  const out = { s: 0, t: 0, los: 0 };
  for (const x of boxesIssuedByDate(from, to).values()) { out.s += x.s; out.t += x.t; out.los += x.los; }
  return out;
}
const boxTxt = b => `${b.s}× 6 · ${b.t}× 10${b.los ? ` · ${b.los} los` : ''}`;
// Lege doosjes op voorraad: gekocht + terug van klanten − uitgegeven; een telling zet het op het getelde aantal.
function boxLedger(asOf){
  const ev = stockEvents().filter(e => isBoxEv(e) && e.date <= asOf);
  if (!ev.length) return null;
  const start = ev.map(e => e.date).sort()[0], issued = boxesIssuedByDate(start, asOf);
  const dates = [...new Set([...ev.map(e => e.date), ...issued.keys()])].sort();
  const st = { s: 0, t: 0 }, tot = { boughtS: 0, boughtT: 0, retS: 0, retT: 0, outS: 0, outT: 0, diffS: 0, diffT: 0 }, diffs = {};
  // een telling op de eerste dag is de beginstand (geen verschil)
  const base = ev.find(e => e.kind === 'boxcount' && e.date === start);
  for (const d of dates) {
    for (const e of ev) if (e.date === d && e.kind !== 'boxcount') {
      st.s += e.box6 || 0; st.t += e.box10 || 0;
      if (e.kind === 'boxes') { tot.boughtS += e.box6 || 0; tot.boughtT += e.box10 || 0; } else { tot.retS += e.box6 || 0; tot.retT += e.box10 || 0; }
    }
    const o = issued.get(d); if (o) { st.s -= o.s; st.t -= o.t; tot.outS += o.s; tot.outT += o.t; }
    for (const e of ev) if (e.date === d && e.kind === 'boxcount') {
      if (e === base) { st.s = e.box6 || 0; st.t = e.box10 || 0; diffs[e.id] = { first: true }; continue; }
      const ds = e.box6 == null ? 0 : e.box6 - st.s, dt = e.box10 == null ? 0 : e.box10 - st.t;
      diffs[e.id] = { s: st.s, t: st.t, ds, dt };
      st.s += ds; st.t += dt; tot.diffS += ds; tot.diffT += dt;
    }
  }
  const out = tot.outS + tot.outT, back = tot.retS + tot.retT;
  return { start, s: st.s, t: st.t, ...tot, diffs, rate: out >= 20 ? Math.min(1, back / out) : null };
}

function boxesExpected(sp){
  let s = 0, t = 0;
  for (const x of sp.period.rows) { const b = boxSplit(x.eggs); if (b) { s += b.s * x.f; t += b.t * x.f; } }
  return { s: Math.round(s), t: Math.round(t) };
}

/* ---------- Planning ---------- */
// Besteladvies voor week T (ook gebruikt voor de samenvatting achter de meldingen)
function orderAdvice(T){
  const cur = weekStart(todayStr());
  const rows = forecast(T), r = realisation(cur);
  const enough = r.weeks >= 3 && r.ratio != null;
  const ratio = enough ? Math.min(1.1, Math.max(0.5, r.ratio)) : 1;
  const sold = sum(rows.filter(x => x.kind === 'verkocht'), x => x.eggs);
  const agreed = rows.filter(x => x.kind === 'afgesproken'), proj = rows.filter(x => x.kind === 'verwacht');
  const sA = sum(agreed, x => x.eggs), sP = sum(proj, x => x.eggs);
  const exact = sold + (sA + sP) * ratio;
  const rnd = db.settings.orderRound || 1;
  const advice = Math.round(exact / rnd) * rnd;
  const nNew = rows.filter(x => x.kind === 'nieuw').length, nUnsure = rows.filter(x => x.kind === 'onzeker').length;
  const dblRows = [...agreed, ...proj].filter(x => x.date && nextVisitImpact(x.a, x.date));
  const dblExtra = sum(dblRows, x => x.eggs);
  const dblDays = [...new Set(dblRows.map(x => nextVisitImpact(x.a, x.date).date))].sort();
  const adviceDbl = Math.round((exact + dblExtra * ratio) / rnd) * rnd;
  const offered = db.visits.filter(v => v.offered && v.date >= addDays(cur, -182));
  const acc = offered.length >= 5 ? offered.filter(v => v.double).length / offered.length : null;
  const adviceAcc = acc != null ? Math.round((exact + dblExtra * acc * ratio) / rnd) * rnd : null;
  const adviceMain = adviceAcc ?? advice;
  return { cur, rows, r, enough, ratio, sold, agreed, proj, sA, sP, exact, rnd, advice, nNew, nUnsure, dblRows, dblExtra, dblDays, adviceDbl, offered, acc, adviceAcc, adviceMain };
}

  const rel = T === cur ? 'deze week' : T === addDays(cur, 7) ? 'volgende week' : T < cur ? 'voorbij' : `over ${weeksBetween(cur, T)} weken`;

      + `<div class="cell"><span class="tx"><span class="st">Niet meegeteld, om niet te veel te bestellen: ${nNew ? `${plural(nNew, 'nieuw adres', 'nieuwe adressen')} · ` : ''}${nUnsure ? `${nUnsure} lang niet bezocht · ` : ''}gemiddeld ${Math.round(r.extraPerWeek)} per week buiten afspraken om.</span></span></div>`;

  if (dblRows.length) {
    h += `<div class="banner red mt12">${I('warn')}<div><b>Geen ronde op ${dblDays.map(fmtShort).join(', ')}.</b> ${plural(dblRows.length, 'klant kan', 'klanten kunnen')} deze week voor 2 weken nemen: <b class="num">+${dblExtra}</b>.
      ${acc != null ? `Eerder zei ${Math.round(acc * 100)}% ja (${offered.length}× aangeboden); daar rekent het advies mee.` : `Als iedereen ja zegt: <b class="num">${adviceDbl}</b>. Het advies rekent met niemand, tot er 5× is aangeboden.`}</div></div>`;
  }
  const days = walkDates(T);
  if (days.length) {
    h += sec('Loopdagen', grp(days.map(d => {
      const rs = rows.filter(x => x.date === d && x.kind !== 'nieuw' && x.kind !== 'onzeker');
      const ab = isAbsent(d);
      return `<div class="cell"><span class="tx"><span class="tt" ${ab ? 'style="color:var(--red)"' : ''}>${esc(fmtLong(d))}</span>
        <span class="st" ${ab && rs.length ? 'style="color:var(--red)"' : ''}>${ab ? (rs.length ? `Geen ronde · spreek met ${plural(rs.length, 'adres', 'adressen')} een andere dag af` : 'Geen ronde') : `${plural(rs.length, 'adres', 'adressen')} · ${sum(rs, x => x.eggs)} eieren`}</span></span>
        ${toggleBtn(!ab, 'absent', `data-date="${d}"`, `Ronde op ${fmtLong(d)}`)}</div>`;
    }).join('')), 'Zet een dag uit als de bezorger dan niet loopt. Dat is meteen zichtbaar in de ronde en bij elk bezoek.');
  } else h += sec('Loopdagen', '', 'Stel eerst de loopdagen in bij Instellingen.');

  const listed = rows.filter(x => x.kind !== 'nieuw' && x.kind !== 'onzeker').sort((x, y) => (x.date || '') < (y.date || '') ? -1 : 1);
  const kl = { verkocht: 'verkocht', afgesproken: 'afgesproken', verwacht: 'vast ritme' };
  h += `<section class="sec"><button class="sec-h tog ${ui.showRows ? 'open' : ''}" data-act="togglerows" aria-expanded="${!!ui.showRows}">Per adres <span class="stat">${listed.length}</span>${I('chevR', 'sm')}</button>
    ${ui.showRows ? grp(listed.map(x => `<div class="cell"><span class="tx"><span class="tt">${esc(label(x.a))}</span><span class="st">${esc(fmtShort(x.date))} · ${kl[x.kind]}</span></span><span class="tr">${x.eggs}</span></div>`).join('') || '<div class="cell"><span class="st">Niets gepland.</span></div>') : ''}</section>`;
  const histWeeks = r.perWeek.filter(pw => pw.sold || pw.agreed).reverse();
  h += `<section class="sec"><button class="sec-h tog ${ui.showHist ? 'open' : ''}" data-act="togglehist" aria-expanded="${!!ui.showHist}">Afgelopen weken${I('chevR', 'sm')}</button>
    ${ui.showHist ? grp(`<table class="h"><tr><th>Week</th><th>Afgesproken</th><th>Verkocht</th></tr>${histWeeks.length ? histWeeks.map(pw => `<tr><td>${isoWeek(pw.w)}</td><td>${pw.agreed}</td><td>${pw.sold}</td></tr>`).join('') : '<tr><td colspan="3" style="text-align:left;color:var(--label2)">Nog geen afgeronde weken.</td></tr>'}</table>`) : ''}</section>`;
  return h + '</main>' + tabs('order');
}

function supplySection(){
  const sp = supplyPlan(), st = sp.st, mPct = Math.round(sp.m * 100), rnd = db.settings.orderRound || 1;
  let h = '';
  // voorraad
  if (!st) {
    h += sec('Voorraad', grp(`<div class="cell"><span class="ico" style="background:var(--tint)">${I('box')}</span><span class="tx"><span class="tt">Nog geen voorraad</span><span class="st">Voeg je eerste levering toe; daarna houdt de app bij wat er over is.</span></span></div>
      <button class="cell tint" data-act="stocknew" data-kind="delivery"><span class="tx"><span class="tt">Levering toevoegen</span></span>${chev()}</button>`));
  } else {
    const left = st.batches.filter(b => b.left > 0), oldest = left[0];
    const due = stockEvents().filter(e => e.kind === 'delivery' && e.delivered == null && e.date <= sp.T).sort((a, b) => a.date < b.date ? -1 : 1)[0];
    h += sec('Voorraad', grp(`<div class="hero"><div class="lbl">Op voorraad</div><div class="big ${st.stock < 0 ? 'red' : ''}"><b class="num">${st.stock}</b><span>eieren</span></div>
      <div class="meta">${oldest ? `Eerst verkopen: <b style="color:var(--label)">${oldest.left}</b> van ${esc(fmtShort(oldest.date))} (${daysBetween(oldest.date, sp.T)} ${daysBetween(oldest.date, sp.T) === 1 ? 'dag' : 'dagen'} oud)` : st.stock < 0 ? 'Meer verkocht dan er was: voeg een levering of telling toe.' : 'Alles verkocht.'}</div></div>`
      + (left.length > 1 ? left.map((b, i) => `<div class="cell"><span class="tx"><span class="tt">${esc(fmtShort(b.date))}${b.extra ? ' · telling' : ''}</span><span class="st">${daysBetween(b.date, sp.T)} dagen oud${i === 0 ? ' · eerst verkopen' : ''}</span></span><span class="tr num">${b.left} van ${b.net}</span></div>`).join('') : '')
      + (due ? `<button class="cell tint" data-act="stockreceive" data-id="${esc(due.id)}"><span class="ico" style="background:var(--green)">${I('down')}</span><span class="tx"><span class="tt">Levering van ${esc(fmtShort(due.date))} ontvangen</span><span class="st">${due.ordered || 0} besteld · vul in wat er kwam en wat kapot is</span></span>${chev()}</button>`
             : `<button class="cell" data-act="stocknew" data-kind="delivery"><span class="ico" style="background:var(--green)">${I('down')}</span><span class="tx"><span class="tt">Levering toevoegen</span></span>${chev()}</button>`)
      + `<button class="cell" data-act="stocknew" data-kind="count"><span class="ico" style="background:var(--gray)">${I('check')}</span><span class="tx"><span class="tt">Voorraad tellen</span><span class="st">Het verschil gaat van de oudste eieren af</span></span>${chev()}</button>`),
      `Sinds ${esc(fmtShort(st.start))}: ${st.sold} verkocht${st.broken ? ` · ${st.broken} kapot geleverd` : ''}${st.loss ? ` · ${st.loss} minder geteld` : ''}${st.found ? ` · ${st.found} meer geteld` : ''}.`);
  }
  // besteladvies voor de eerstvolgende besteldag
  const pctTxt = sp.pct == null ? '' : `${Math.round(sp.pct * 100)}%`;
  if (sp.atDelivery < 0) h += `<div class="banner red mt12">${I('warn')}<div><b>Tekort vóór de levering:</b> naar verwachting ${-sp.atDelivery} eieren te weinig tot ${esc(fmtShort(sp.delivery))}.</div></div>`;
  let band;
  if (sp.advice === 0 && sp.pct != null && sp.pct > sp.m) band = `Genoeg voorraad: niets bestellen. Bij de levering daarna is er naar verwachting ${sp.leftover} over (${sp.pct > 1 ? `genoeg voor ±${Math.round(sp.pct)} ${Math.round(sp.pct) === 1 ? 'week' : 'weken'}` : pctTxt}).`;
  else if (sp.period.total === 0) band = 'Nog geen verwachte verkoop in die periode (geen afspraken of loopdagen).';
  else band = `Daarmee is er bij de levering daarna ±${sp.leftover} over (${pctTxt}; marge ${mPct}%).`;
  const lbl = sp.overdue && !sp.existing ? `Levering ${esc(fmtLong(sp.delivery))}: nog niet vastgelegd` : sp.orderDate === sp.T ? 'Vandaag bestellen' : `Bestellen op ${esc(fmtLong(sp.orderDate))}`;
  const meta = sp.overdue && !sp.existing
    ? `De besteldag was ${esc(fmtLong(sp.orderDate))}. Leg vast hoeveel je besteld hebt; dan rekent de app daarmee verder en gaat het advies naar de levering erna.`
    : `Voor de levering van ${esc(fmtLong(sp.delivery))}. ${band}`;
  h += `<section class="sec"><h2 class="sec-h">Bestellen</h2><div class="grp"><div class="hero order"><div class="lbl">${lbl}</div>
      <div class="big"><b class="num">${sp.advice}</b><span>eieren${sp.overdue && !sp.existing ? ' (advies)' : ''}</span></div>
      <div class="meta">${meta}</div></div>
    <button class="cell" data-act="togglesupply" aria-expanded="${!!ui.showSupply}"><span class="tx"><span class="tt" style="color:var(--tint)">Hoe berekend</span></span><span style="display:inline-flex;transform:rotate(${ui.showSupply ? 90 : 0}deg);transition:transform .2s">${I('chevR', 'chev')}</span></button>`;
  if (ui.showSupply) {
    const line = (t, n, st2) => `<div class="cell"><span class="tx"><span class="tt">${t}</span>${st2 ? `<span class="st">${st2}</span>` : ''}</span><span class="tr num">${n}</span></div>`;
    const own = sp.period.rows.filter(x => x.own).length;
    h += line('Op voorraad nu', sp.stock)
      + (sp.pending ? line('+ Besteld, nog onderweg', sp.pending) : '')
      + line(`− Verwachte verkoop tot de levering`, sp.before.total, `${esc(fmtShort(sp.T))} t/m ${esc(fmtShort(addDays(sp.delivery, -1)))}`)
      + line('= Voorraad bij de levering', sp.atDelivery)
      + line('Verwachte verkoop in de periode', sp.period.total, `${esc(fmtShort(sp.delivery))} t/m ${esc(fmtShort(addDays(sp.nextDel, -1)))} · ${plural(sp.period.rows.length, 'bezoek', 'bezoeken')}, ${sp.period.agreed} afgesproken`)
      + line(`+ Marge ${mPct}%`, sp.target - sp.period.total)
      + line(`Advies${rnd > 1 ? `, afgerond op ${rnd}` : ''}`, sp.advice)
      + `<div class="cell"><span class="tx"><span class="st">Per klant tellen mee: frequentie en afgesproken volgende keer, het afgesproken aantal, voorkeursdagen, loopdagen en afwezigheid van de bezorger. En hoe vaak de klant echt thuis was en het afgesproken aantal nam (${own} ${own === 1 ? 'klant' : 'klanten'} met eigen historie; de rest met het teamgemiddelde van ${Math.round(sp.period.teamRatio * 100)}%). Nieuwe adressen zonder afspraak tellen niet mee.</span></span></div>`;
    if (sp.period.rows.length) h += sp.period.rows.slice().sort((x, y) => x.date < y.date ? -1 : 1).map(x => `<div class="cell"><span class="tx"><span class="tt">${esc(label(x.a))}</span><span class="st">${esc(fmtShort(x.date))} · ${x.eggs} afgesproken${x.f !== 1 ? ` × ${Math.round(x.f * 100)}%${x.own ? '' : ' (team)'}` : ''}</span></span><span class="tr num">${Math.round(x.exp)}</span></div>`).join('');
  }
  if (sp.existing) h += `<button class="cell" data-act="stockedit" data-id="${esc(sp.existing.id)}"><span class="ico" style="background:var(--green)">${I('check')}</span><span class="tx"><span class="tt">Besteld voor ${esc(fmtShort(sp.delivery))}: ${sp.existing.ordered ?? 0}</span>${sp.existing.ordered != null && sp.existing.ordered !== sp.advice ? `<span class="st">Advies is nu ${sp.advice}</span>` : ''}</span>${chev()}</button>`;
  else if (sp.overdue) h += `<button class="cell tint" data-act="stockorder"><span class="ico" style="background:var(--tint)">${I('box')}</span><span class="tx"><span class="tt">Leg vast wat je besteld hebt</span><span class="st">Voor ${esc(fmtShort(sp.delivery))} · vul het echte aantal in</span></span>${chev()}</button>`;
  else h += `<button class="cell tint" data-act="stockorder"><span class="ico" style="background:var(--tint)">${I('box')}</span><span class="tx"><span class="tt">Leg bestelling vast: ${sp.advice}</span><span class="st">Je kunt het aantal nog aanpassen</span></span>${chev()}</button>`;
  h += '</div></section>';
  h += boxSection(sp);
  h += wafelSection(sp);
  // leveringen, bestellingen en tellingen
  const eggEvs = stockEvents().filter(e => !isBoxEv(e) && !isWafelEv(e));
  const evs = eggEvs.slice().sort((a, b) => a.date > b.date ? -1 : a.date < b.date ? 1 : 0).slice(0, ui.showAllStock ? 999 : 6);
  if (evs.length) {
    const diffs = (stockAt(sp.T) || { diffs: {} }).diffs;
    h += sec('Leveringen en tellingen', grp(evs.map(e => {
      let t, st2;
      if (e.kind === 'count') { const d = diffs[e.id]; t = `Telling: ${e.counted ?? '–'}`; st2 = d ? (d.diff === 0 ? 'klopte' : `${d.diff > 0 ? '+' : ''}${d.diff} t.o.v. berekend`) : ''; }
      else if (e.delivered == null) { t = `Besteld: ${e.ordered ?? 0}`; st2 = 'nog onderweg'; }
      else { t = `Geleverd: ${e.delivered}`; st2 = `${e.broken ? `${e.broken} kapot · netto ${Math.max(0, e.delivered - e.broken)}` : 'niets kapot'}${e.ordered != null && e.ordered !== e.delivered ? ` · besteld ${e.ordered}` : ''}`; }
      return `<button class="cell" data-act="stockedit" data-id="${esc(e.id)}"><span class="tx"><span class="tt">${esc(fmtShort(e.date))} · ${t}</span>${st2 ? `<span class="st">${st2}${e.note ? ' · ' + esc(e.note) : ''}</span>` : ''}</span>${chev()}</button>`;
    }).join('') + (eggEvs.length > 6 && !ui.showAllStock ? '<button class="cell tint center" data-act="showallstock">Toon alles</button>' : '')));
  }
  // marge per leverperiode
  const hist = periodHistory();
  if (hist.length) {
    h += sec(`Marge per levering (doel ${mPct}%)`, grp(hist.map(p => {
      let badge;
      if (!p.next) badge = '<span class="badge gray">loopt nog</span>';
      else if (p.left < 0) badge = '<span class="badge red">tekort</span>';
      else if (p.first && p.pct > sp.m) badge = '<span class="badge gray">eerste levering</span>';
      else if (p.pct > sp.m) badge = '<span class="badge red">te veel over</span>';
      else badge = '<span class="badge green">binnen marge</span>';
      const bx = boxesIssued(p.from, p.to);
      return `<div class="cell"><span class="tx"><span class="tt">${esc(fmtShort(p.from))} – ${esc(fmtShort(p.to))}</span><span class="st">${p.net} netto · ${p.sold} verkocht${p.next ? ` · ${p.left} over (${p.pct == null ? '–' : Math.round(p.pct * 100) + '%'})` : ''} ${badge}</span>${bx.s || bx.t ? `<span class="st">Doosjes: ${boxTxt(bx)}</span>` : ''}</span></div>`;
    }).join('')), 'Over = wat er nog lag toen de volgende levering kwam, als % van wat er in die periode verkocht is.');
  }
  return h;
}

function boxSection(sp){
  const T = sp.T, L = boxLedger(T), wk = boxesIssued(weekStart(T), T), exp = boxesExpected(sp);
  const line = (t, n, st2, cls) => `<div class="cell"><span class="tx"><span class="tt">${t}</span>${st2 ? `<span class="st">${st2}</span>` : ''}</span><span class="tr num ${cls || ''}">${n}</span></div>`;
  const net = f => Math.round(f * (1 - (L && L.rate != null ? L.rate : 0)));
  const weeksFor = (have, need) => need > 0 ? Math.floor(Math.max(0, have) / need) : null;
  let g = '';
  if (L) {
    const ws = weeksFor(L.s, net(exp.s)), wt = weeksFor(L.t, net(exp.t));
    const w = (size, n) => n < 1 ? `<span style="color:var(--red)">van ${size} te weinig voor een week</span>` : `van ${size} genoeg voor ±${n} ${n === 1 ? 'week' : 'weken'}`;
    const parts = [ws != null ? w(6, ws) : '', wt != null ? w(10, wt) : ''].filter(Boolean);
    g += `<div class="hero"><div class="lbl">Lege doosjes op voorraad</div><div class="big two"><b class="num ${L.s < 0 ? 'red' : ''}">${L.s}</b><span>van 6</span><b class="num ${L.t < 0 ? 'red' : ''}" style="margin-left:18px">${L.t}</b><span>van 10</span></div>
      <div class="meta">${parts.length ? parts.join(', ').replace(/^v/, 'V') + '.' : 'Nog geen verwachte verkoop om mee te rekenen.'}</div></div>`;
  } else {
    g += `<div class="cell"><span class="ico" style="background:var(--tint)">${I('box')}</span><span class="tx"><span class="tt">Lege doosjes bijhouden</span><span class="st">Tel hoeveel lege doosjes je hebt. Daarna rekent de app bij wat er uitgaat, terugkomt en wat je koopt.</span></span></div>`;
  }
  g += line('Uitgegeven deze week', `${wk.s}× 6<br>${wk.t}× 10`, wk.los ? `plus ${wk.los} eieren die niet in hele doosjes passen` : '');
  g += line('Verwacht per week', `±${exp.s}× 6<br>±${exp.t}× 10`, L && L.rate != null ? `${Math.round(L.rate * 100)}% komt terug, dus netto ±${net(exp.s)}× 6 en ±${net(exp.t)}× 10 nodig` : 'volgens de afspraken; nog niet bekend hoeveel er terugkomt');
  g += `<button class="cell" data-act="stocknew" data-kind="boxreturn"><span class="ico" style="background:var(--green)">${I('down')}</span><span class="tx"><span class="tt">Doosjes terug van klanten</span><span class="st">Na de ronde: hoeveel lege doosjes je hebt teruggekregen</span></span>${chev()}</button>`;
  g += `<button class="cell" data-act="stocknew" data-kind="boxes"><span class="ico" style="background:var(--tint)">${I('plus')}</span><span class="tx"><span class="tt">Doosjes gekocht</span></span>${chev()}</button>`;
  g += `<button class="cell" data-act="stocknew" data-kind="boxcount"><span class="ico" style="background:var(--gray)">${I('check')}</span><span class="tx"><span class="tt">Lege doosjes tellen</span></span>${chev()}</button>`;
  let foot = 'Een verkoop gaat in zoveel mogelijk doosjes van 10, de rest in doosjes van 6 (30 eieren = 3× 10).';
  if (L) {
    const out = L.outS + L.outT, back = L.retS + L.retT;
    foot = `Sinds ${esc(fmtShort(L.start))}: ${L.outS}× 6 en ${L.outT}× 10 uitgegeven, ${back} terug${out ? ` (${Math.round(back / out * 100)}%)` : ''}${L.boughtS || L.boughtT ? `, ${L.boughtS}× 6 en ${L.boughtT}× 10 gekocht` : ''}. ` + foot;
  }
  let h = sec('Doosjes', grp(g), foot);
  // per week: hoeveel doosjes van 6 en van 10
  const cur = weekStart(T), weeks = [];
  for (let k = 0; k < 8; k++) { const w = addDays(cur, -7 * k), b = boxesIssued(w, addDays(w, 6)); if (b.s || b.t || b.los) weeks.push({ w, b }); }
  const bevs = stockEvents().filter(isBoxEv).sort((a, b) => a.date > b.date ? -1 : a.date < b.date ? 1 : 0);
  h += `<section class="sec"><button class="sec-h tog ${ui.showBoxes ? 'open' : ''}" data-act="toggleboxes" aria-expanded="${!!ui.showBoxes}">Doosjes per week en invoer${I('chevR', 'sm')}</button>`;
  if (ui.showBoxes) {
    h += grp(`<table class="h"><tr><th>Week</th><th>Van 6</th><th>Van 10</th></tr>${weeks.length ? weeks.map(x => `<tr><td>${isoWeek(x.w)}</td><td>${x.b.s}</td><td>${x.b.t}</td></tr>`).join('') : '<tr><td colspan="3" style="text-align:left;color:var(--label2)">Nog niets verkocht.</td></tr>'}</table>`);
    if (bevs.length) {
      const KT = { boxes: 'Gekocht', boxreturn: 'Terug van klanten', boxcount: 'Geteld' };
      h += `<div class="grp mt12">${bevs.slice(0, 12).map(e => {
        const d = e.kind === 'boxcount' && L ? L.diffs[e.id] : null;
        const st2 = d && d.first ? 'beginstand' : d ? (d.ds === 0 && d.dt === 0 ? 'klopte' : `${d.ds > 0 ? '+' : ''}${d.ds}× 6 · ${d.dt > 0 ? '+' : ''}${d.dt}× 10 t.o.v. berekend`) : '';
        return `<button class="cell" data-act="stockedit" data-id="${esc(e.id)}"><span class="tx"><span class="tt">${esc(fmtShort(e.date))} · ${KT[e.kind]}: ${e.box6 ?? 0}× 6 · ${e.box10 ?? 0}× 10</span>${st2 || e.note ? `<span class="st">${[st2, esc(e.note || '')].filter(Boolean).join(' · ')}</span>` : ''}</span>${chev()}</button>`;
      }).join('')}</div>`;
    }
  }
  return h + '</section>';
}

function wafelSection(sp){
  const T = sp.T, ws = stroopWeeks(), cur = weekStart(T), up = ws.filter(w => w >= cur), past = ws.filter(w => w < cur).reverse();
  const L = wafelStock(T), S = up[0], m = sp.m;
  let g = '';
  if (S) {
    const ag = wafelAgreed(S), agN = sum(ag, x => x.n), have = L ? L.stock : 0;
    const need = Math.max(0, Math.ceil(agN * (1 + m)) - Math.max(0, have));
    g += `<div class="hero"><div class="lbl">${S === cur ? 'Deze week stroopwafels' : `Stroopwafels in ${esc(stroopLabel(S))}`}</div><div class="big"><b class="num">${agN}</b><span>${agN === 1 ? 'pakje' : 'pakjes'} afgesproken</span></div>
      <div class="meta">${ag.length ? `Bij ${plural(ag.length, 'adres', 'adressen')}. ` : 'Nog niemand heeft pakjes afgesproken. '}${L ? `Op voorraad ${have}. ` : ''}${need ? `Nodig met marge ${Math.round(m * 100)}%: nog <b style="color:var(--label)">${need}</b> pakjes erbij.` : agN ? 'Genoeg op voorraad voor de afspraken.' : ''}</div></div>`;
    if (ag.length) g += `<button class="cell" data-act="togglewafels" aria-expanded="${!!ui.showWafels}"><span class="tx"><span class="tt" style="color:var(--tint)">Wie heeft afgesproken</span></span><span style="display:inline-flex;transform:rotate(${ui.showWafels ? 90 : 0}deg);transition:transform .2s">${I('chevR', 'chev')}</span></button>`
      + (ui.showWafels ? ag.map(x => `<div class="cell"><span class="tx"><span class="tt">${esc(label(x.a))}</span><span class="st">afgesproken ${esc(fmtShort(x.date))}</span></span><span class="tr num">${x.n}</span></div>`).join('') : '');
  } else {
    g += `<div class="cell"><span class="ico" style="background:var(--orange)">${I('cal')}</span><span class="tx"><span class="tt">Geen stroopwafelweek gepland</span><span class="st">Plan een week; dan meldt de app in de weken ervoor aan de deur dat het eraan komt.</span></span></div>`;
  }
  g += up.map(w => `<button class="cell" data-act="wafelweek" data-w="${w}" ${isAdmin() ? '' : 'disabled'}><span class="tx"><span class="tt">${w === cur ? 'Deze week · ' : ''}${esc(stroopLabel(w))}</span><span class="st">${w === cur ? `${wafelsSold(w, addDays(w, 6))} pakjes verkocht` : `aankondigen vanaf ${esc(stroopLabel(addDays(w, -7 * (db.settings.stroopLead ?? 2))))}`}</span></span>${isAdmin() ? chev() : ''}</button>`).join('');
  if (isAdmin()) g += `<button class="cell tint" data-act="wafeladdweek"><span class="ico" style="background:var(--orange)">${I('plus')}</span><span class="tx"><span class="tt">Stroopwafelweek plannen</span></span>${chev()}</button>`;

function bulkParse(text){
  const out = []; let street = '';
  for (let line of text.split(/\r?\n/)) {
    line = line.trim().replace(/\s+/g, ' ');
    if (!line) continue;
    let m = line.match(/^(.*?)\s*(\d+)\s*-\s*(\d+)(?:\s+(even|oneven))?$/i);
    if (m && (m[1] || street)) {
      const s = m[1] || street, from = +m[2], to = +m[3];
      if (Math.abs(to - from) > 500) continue;
      street = s;
      const step = m[4] ? 2 : 1, dir = to >= from ? 1 : -1;
      let start = from;
      if (m[4]) { const wantEven = m[4].toLowerCase() === 'even'; if ((start % 2 === 0) !== wantEven) start += dir; }
      for (let n = start; dir > 0 ? n <= to : n >= to; n += step * dir) out.push({ street: s, number: String(n) });
      continue;
    }
    m = line.match(/^(.*?)\s*(\d+[\w\-\/]*(?:\s[a-zA-Z])?)$/);
    if (m && (m[1] || street)) { street = m[1] || street; out.push({ street, number: m[2] }); continue; }
    out.push({ street: line, number: '' }); street = line;
  }
  return out;
}

function go(view, extra){
  const from = ui.view;

  saveUi();
  let dir = (extra && extra._dir) || null;
  if (!dir && from !== view) dir = (DEPTH[view] || 0) > (DEPTH[from] || 0) ? 'push' : (DEPTH[view] || 0) < (DEPTH[from] || 0) ? 'pop' : null;
  delete ui._dir;
  const swap = () => { render(); window.scrollTo(0, 0); const t = app.querySelector('h1[tabindex]'); if (t) t.focus({ preventScroll: true }); };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (dir && document.startViewTransition && !reduce && !vtBusy && document.visibilityState === 'visible') {
    vtBusy = true;
    document.documentElement.classList.add(dir);
    const tr = document.startViewTransition(swap);
    tr.ready.catch(() => {}); // afgebroken overgang (bijv. app naar achtergrond) is geen fout
    tr.finished.catch(() => {}).finally(() => { vtBusy = false; document.documentElement.classList.remove('push', 'pop'); });
  } else swap();
}

const curVisit = () => db.visits.find(x => x.addressId === ui.id && x.date === ui.date);
function setVisit(patch, id, quiet){
  id = id || ui.id;
  const D = ui.date, a = byId(id);
  const ag = lastDecisive(visitsOf(a.id), D);
  let v = db.visits.find(x => x.addressId === id && x.date === D);
  if (!v) { v = { id: `${a.id}_${D}`, addressId: a.id, date: D, status: 'sold', eggs: 0, nextDate: null, nextEggs: null, nextManual: false, note: '', wafels: 0, wafelsNext: null }; db.visits.push(v); }
  // stroopwafels die al gekozen waren voordat het bezoek genoteerd werd
  const dk = `${id}_${D}`, dr = ui.wafelDraft && ui.wafelDraft[dk];
  if (dr) { Object.assign(v, dr); delete ui.wafelDraft[dk]; saveUi(); }
  Object.assign(v, patch, { ts: Date.now() });
  if (v.status !== 'sold') v.double = false;
  // onthouden dat "voor 2 weken" is aangeboden: zo leert de app hoe vaak klanten daarop ingaan
  v.offered = DEC(v) && !!nextVisitImpact(a, D);
  if (v.status === 'nothome') { v.eggs = 0; v.nextDate = null; v.nextEggs = null; v.nextManual = false; v.wafels = 0; v.wafelsNext = null; }
  else {
    if (!v.nextDate) v.nextDate = defaultNext(a, D, freqOf(a));
    if (!v.nextManual) v.nextEggs = v.eggs > 0 ? v.eggs : agEggs(ag);
    if (v.nextEggs == null) v.nextEggs = 0;
  }
  save(quiet);
  if (!quiet) render();
  return v;
}
function snapshotVisit(id){ const v = db.visits.find(x => x.addressId === id && x.date === ui.date); return v ? { ...v } : null; }
function restoreVisit(id, snap){
  db.visits = db.visits.filter(x => !(x.addressId === id && x.date === ui.date));
  if (snap) db.visits.push(snap);
  save();
}
function visitSummary(v){
  if (v.status === 'nothome') return 'niet thuis';
  return `${v.status === 'none' ? 'geen eieren' : v.eggs + ' eieren'}${v.wafels ? ` + ${plural(v.wafels, 'pakje', 'pakjes')} stroopwafels` : ''} · volgende keer ${fmtShort(v.nextDate)}`;
}

function nextTarget(dir){

  const t = dir > 0 ? p.shown.find(x => x.i > i) : [...p.shown].reverse().find(x => x.i < i);

  else if (dir > 0) { const p = plan(ui.date); go('home'); toast(p.shown.every(x => x.today) ? 'Einde van de route. Alles gedaan!' : 'Einde van de route. Er staan nog open adressen.'); }

function moveTo(a, pos){

document.addEventListener('click', e => {

    case 'today': ui.date = todayStr(); ui.dateSetOn = todayStr(); saveUi(); render(); break;
    case 'day': ui.date = addDays(ui.date, +el.dataset.n); ui.dateSetOn = todayStr(); saveUi(); render(); break;

    case 'togglehidden': ui.showHidden = !ui.showHidden; saveUi(); render(); break;
    case 'togglerows': ui.showRows = !ui.showRows; saveUi(); render(); break;
    case 'togglehist': ui.showHist = !ui.showHist; saveUi(); render(); break;
    case 'togglecalc': ui.showCalc = !ui.showCalc; saveUi(); render(); break;
    case 'togglesupply': ui.showSupply = !ui.showSupply; saveUi(); render(); break;

    case 'togglewafels': ui.showWafels = !ui.showWafels; saveUi(); render(); break;
    case 'togglewafelhist': ui.showWafelHist = !ui.showWafelHist; saveUi(); render(); break;
    case 'wafeladdweek': {
      const cur = weekStart(todayStr()), have = stroopWeeks();
      const opts = []; for (let k = 0; k < 12 && opts.length < 8; k++) { const w = addDays(cur, 7 * k); if (!have.includes(w)) opts.push(w); }
      actionSheet({ title: 'Welke week stroopwafels?', message: `In de ${db.settings.stroopLead ?? 2} weken ervoor meldt de app het aan de deur.`, actions: opts.map(w => ({ label: `${w === cur ? 'Deze week · ' : ''}Week ${isoWeek(w)} · ${weekLabel(w)}`, value: w })) }).then(w => {
        if (!w) return; db.settings.stroopWeeks = [...stroopWeeks(), w].sort(); save(); render(); toast(`Stroopwafels in ${stroopLabel(w)}`);
      });

    case 'wafelweek': {

        if (r !== 'del') return; db.settings.stroopWeeks = stroopWeeks().filter(x => x !== w); save(); render();
        toast(`${stroopLabel(w)} weggehaald`, 'Ongedaan', () => { db.settings.stroopWeeks = [...stroopWeeks(), w].sort(); save(); render(); });
      });
      break;
    }
    case 'wafel': {
      // pakjes aan de deur: afgesproken voor de stroopwafelweek (wafelsNext) of verkocht (wafels)
      const k = el.dataset.k, n = +el.dataset.n, v = curVisit();
      if (v && v.status !== 'nothome') {

/* ---------- vegen: rijen in de ronde (zoals Mail) en tussen huizen (zoals Foto's) ---------- */
let openSwipe = null, swipeJustEnded = false, drag = null;
function closeSwipe(instant){
  if (!openSwipe) return;
  const fg = openSwipe.querySelector('.sw-fg');
  if (fg) { if (instant) fg.classList.add('drag'); fg.style.transform = ''; if (instant) requestAnimationFrame(() => fg.classList.remove('drag')); }
  openSwipe = null;
}
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const sw = e.target.closest('.sw[data-id]');
  const house = !sw && ui.view === 'house' && !ui.sheet && e.target.closest('.house-main') && !e.target.closest('input,textarea,.stepper,.chips,.segc');
  if (!sw && !house) return;
  if (house && (e.clientX < 24 || e.clientX > innerWidth - 24)) return;
  drag = { sw, house, x: e.clientX, y: e.clientY, dx: 0, active: false, base: 0 };
  if (sw) { const fg = sw.querySelector('.sw-fg'); const m = /translateX\((-?\d+)/.exec(fg.style.transform || ''); drag.base = m ? +m[1] : 0; drag.fg = fg; }
}, { passive: true });
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.active) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    if (Math.abs(dx) < (drag.house ? 24 : 18)) return;
    drag.active = true;
    if (drag.sw) { if (openSwipe && openSwipe !== drag.sw) closeSwipe(); drag.fg.classList.add('drag'); }
  }
  drag.dx = dx;
  if (drag.sw) {
    let x = drag.base + dx;
    const canL = !!drag.sw.dataset.same;
    if (!canL) x = Math.min(0, x);
    x = Math.max(-200, Math.min(canL ? 220 : 0, x));
    drag.fg.style.transform = `translateX(${x}px)`;
  } else if (drag.house) {
    const m = app.querySelector('.house-main'); if (m) { m.style.transform = `translateX(${dx * .35}px)`; m.style.opacity = String(1 - Math.min(.4, Math.abs(dx) / 600)); }
  }
}, { passive: true });
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.active) return;
  swipeJustEnded = true; setTimeout(() => { swipeJustEnded = false; }, 60);
  if (d.sw) {
    d.fg.classList.remove('drag');
    const x = d.base + d.dx, id = d.sw.dataset.id;
    if (x > 150 && d.sw.dataset.same) { d.fg.style.transform = ''; openSwipe = null; const n = agreedFor(id); if (n) recordFromList(id, { status: 'sold', eggs: n }); return; }
    if (x > 60 && d.sw.dataset.same) { d.fg.style.transform = 'translateX(88px)'; openSwipe = d.sw; return; }
    if (x < -60) { d.fg.style.transform = 'translateX(-176px)'; openSwipe = d.sw; return; }
    d.fg.style.transform = ''; if (openSwipe === d.sw) openSwipe = null;
  } else if (d.house) {
    const m = app.querySelector('.house-main'); if (m) { m.style.transform = ''; m.style.opacity = ''; }
    if (Math.abs(d.dx) > 70) step(d.dx < 0 ? 1 : -1);
  }
});
document.addEventListener('pointercancel', () => {
  if (drag && drag.fg) { drag.fg.classList.remove('drag'); drag.fg.style.transform = ''; }
  const m = app.querySelector('.house-main'); if (m) { m.style.transform = ''; m.style.opacity = ''; }
  drag = null;
});

/* ---------- invoervelden ---------- */
// Een veld verliest zijn focus doordat je ergens op tikt. Eerst die tik laten aankomen, dan pas hertekenen.
function renderAfterTap(){
  setTimeout(() => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName)) { renderDeferred = true; return; }
    render();
  }, 250);
}
let noteTimer = null;
function onField(e){
  const el = e.target, f = el.dataset && el.dataset.field;
  if (!f) return;
  if (f === 'vnote') {
    clearTimeout(noteTimer);
    const val = el.value;
    noteTimer = setTimeout(() => { const v = curVisit(); if (v) { v.note = val; save(true); } }, e.type === 'change' ? 0 : 500);
    return;
  }
  if (f === 'nextDate') { if (e.type === 'change' && el.value) { setVisit({ nextDate: el.value }, null, true); renderAfterTap(); } return; }
  if (f.startsWith('st_')) {
    const se = stockEvents().find(x => x.id === ui.stockId); if (!se) return;
    const k = f.slice(3);
    if (k === 'note') { se.note = el.value; clearTimeout(noteTimer); noteTimer = setTimeout(() => save(true), 400); return; }
    if (e.type !== 'change') return; // getallen en datum pas opslaan bij het verlaten van het veld
    if (k === 'date') { if (!el.value) return; se.date = el.value; }
    else { const n = el.value === '' ? null : Math.max(0, Math.round(+el.value)); se[k] = k === 'broken' ? (n || 0) : n; }
    save(); renderAfterTap();
    return;
  }
  if (f === 'set_margin' || f === 'set_orderdow' || f === 'set_deldow') {
    if (e.type !== 'change') return;
    if (f === 'set_margin') db.settings.marginPct = Math.max(0, Math.min(100, Math.round(+el.value || 0)));
    if (f === 'set_orderdow') db.settings.orderDow = +el.value;
    if (f === 'set_deldow') db.settings.deliveryDow = +el.value;
    save(); renderAfterTap(); return;
  }
  if (f === 'pushtime' || f === 'pushorder') {
    if (e.type !== 'change') return;
    const patch = f === 'pushtime' ? { walkday: el.value } : { order: el.value === '' ? null : { dow: +el.value, time: '18:00' } };
    pushPrefs(patch).catch(err => toast(err.message, null, null, 'err'));
    return;
  }
  if (f === 'absenceScript') {
    if (e.type !== 'change') return;
    db.settings.absenceScript = el.value.trim() === DEFAULT_SCRIPT ? '' : el.value.trim(); save(); return;
  }
  if (f === 'order') {
    if (e.type !== 'change') return;
    if (el.value === '') delete db.orders[ui.ow]; else db.orders[ui.ow] = Math.max(0, Math.round(+el.value));
    save(); renderAfterTap(); return;
  }
  if (ui.view === 'edit') {
    const isNew = !ui.id, a = isNew ? ui.draft : byId(ui.id);
    if (!a) return;
    const val = el.value;
    if (f === 'pos') {
      if (e.type !== 'change') return;
      if (isNew) { a.pos = +val; saveUi(); return; }
      moveTo(a, +val); save(); renderAfterTap(); return;
    }
    a[f] = val;
    if (isNew) { saveUi(); return; }
    if (e.type === 'change') { a[f] = a[f].trim(); save(); }
  }
}
document.addEventListener('input', e => {
  if (e.target.id === 'bulktext') {
    ui.bulkText = e.target.value; saveUi();
    const c = document.getElementById('bulkcount'); if (c) c.textContent = plural(bulkParse(e.target.value).length, 'adres', 'adressen') + ' gevonden';

});

/* ---------- backup ---------- */
async function shareOrDownload(name, text, type){
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}
async function exportBackup(){
  const now = new Date();
  const data = JSON.stringify({ app: 'egg-sellent', exportedAt: `${ymd(now)}T${pad(now.getHours())}:${pad(now.getMinutes())}`, ...db, settings: { ...db.settings, lastBackup: ymd(now) } });
  if (await shareOrDownload(`egg-sellent-backup-${ymd(now)}.json`, data, 'application/json')) {
    db.settings.lastBackup = ymd(now); save(); render(); toast('Backup gemaakt');
  }
}
async function exportCsv(){
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const lines = ['datum;straat;nummer;naam;email;resultaat;eieren;doosjes_6;doosjes_10;stroopwafels;stroopwafels_afgesproken;volgende_keer;volgende_aantal;opmerking'];
  const vs = db.visits.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  for (const v of vs) {
    const a = byId(v.addressId) || {};
    lines.push([v.date, q(a.street), q(a.number), q(a.name), q(a.email), v.status === 'nothome' ? 'niet thuis' : v.status === 'none' ? 'geen' : 'verkocht', v.eggs || 0, (boxSplit(v.eggs) || { s: '' }).s, (boxSplit(v.eggs) || { t: '' }).t, v.wafels || 0, v.wafelsNext ?? '', v.nextDate || '', v.nextEggs ?? '', q(v.note)].join(';'));
  }
  await shareOrDownload(`egg-sellent-bezoeken-${todayStr()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}
document.getElementById('importfile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.addresses) || !Array.isArray(d.visits)) throw new Error('Dit is geen Egg-sellent-backup.');
    const ok = await confirmSheet(`Backup van ${d.exportedAt || 'onbekende datum'} terugzetten?`, `${plural(d.addresses.length, 'adres', 'adressen')}, ${plural(d.visits.length, 'bezoek', 'bezoeken')}. Dit vervangt alle huidige gegevens ${syncOn() ? 'van het hele team' : 'op deze telefoon'}.`, 'Zet terug', true);
    if (!ok) return;
    delete d.app; delete d.exportedAt;
    db = migrate(d); if (CLOUD) rekeyVisits(); save(); go('home'); toast('Backup teruggezet');
  } catch (err) { toast('Terugzetten mislukt: ' + err.message, null, null, 'err'); }
});

let toastTimer = null;
function toast(msg, actLabel, fn, kind){

  t.innerHTML = `<div class="t ${kind || ''}" role="status"><span>${esc(msg)}</span>${actLabel ? `<button>${esc(actLabel)}</button>` : ''}</div>`;

  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.innerHTML = ''; }, actLabel ? 5000 : 2600);
}
