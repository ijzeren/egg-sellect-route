<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilates-figuren</title>
<link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="../training/training.css">
<style>body{padding:12px;font:14px system-ui}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.c{background:var(--cell);border-radius:12px;padding:8px}.c b{font-size:12px}.fig{width:100%;max-height:110px}</style>
</head><body><div class="g" id="g"></div>
<script type="module">
// Ontwikkelpagina: alle Pilates-figuren (bewegend). Niet in de app; ?still toont begin- en eindhouding.
import { E } from '../training/sports/pilates/data.js';
import { FIG } from '../training/sports/pilates/figures.js';
import { figureSVG, animateFigures } from '../training/sports/pilates/rig.js';
const still = location.search.includes('still');
document.getElementById('g').innerHTML = Object.keys(E).slice(+(new URLSearchParams(location.search).get('from') || 0)).map(id => `<div class="c"><b>${id} · ${E[id].n}</b>` + (still
  ? FIG[id].k.map(p => figureSVG({ ...FIG[id], k: [p] })).join('')
  : figureSVG(FIG[id], { id })) + '</div>').join('');
if (!still) animateFigures(id => FIG[id]);
</script></body></html>
